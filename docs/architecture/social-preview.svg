<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <style>
      .brand-title { font: 700 54px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #17231d; letter-spacing: -1.2px; }
      .brand-sub { font: 500 22px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #46574e; }
      .brand-cn { font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #205a45; }
      .pill-txt { font: 600 15px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #1b4d3a; }
      .card-t { font: 650 18px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #1a2620; }
      .card-b { font: 400 14px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #55635c; }
      .foot-txt { font: 500 15px -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; fill: #697870; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f9f5"/>
      <stop offset="100%" stop-color="#eaf2ec"/>
    </linearGradient>
    <filter id="card-sh" x="-5%" y="-8%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#153224" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="220" fill="#205a45" fill-opacity="0.05"/>
  <circle cx="120" cy="590" r="180" fill="#205a45" fill-opacity="0.04"/>

  <!-- Top Brand Lockup -->
  <rect x="76" y="68" width="56" height="56" rx="15" fill="#205a45"/>
  <path d="M104 82 L108.5 93.5 L120 98 L108.5 102.5 L104 114 L99.5 102.5 L88 98 L99.5 93.5 Z" fill="#e8f5ee"/>
  <text x="150" y="114" class="brand-title">Agent Alliance</text>

  <rect x="530" y="79" width="112" height="34" rx="17" fill="#205a45"/>
  <text x="586" y="101" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">v0.2.1</text>
  <rect x="654" y="79" width="144" height="34" rx="17" fill="#e1eee7" stroke="#c3dbc9"/>
  <text x="726" y="101" text-anchor="middle" class="pill-txt">Apache-2.0</text>
  <rect x="810" y="79" width="174" height="34" rx="17" fill="#e1eee7" stroke="#c3dbc9"/>
  <text x="897" y="101" text-anchor="middle" class="pill-txt">Self-Hosted Docker</text>

  <text x="76" y="172" class="brand-sub">Open-Source Enterprise AI Agent &amp; Team Space Platform</text>
  <text x="76" y="206" class="brand-cn">个人私密空间 · 团队共享知识库 · ERP/CRM/电商行级权限 · L2 写回确认 · 可逆 DLP 护栏</text>

  <!-- 6 Feature Cards (3x2) -->
  <g filter="url(#card-sh)">
    <rect x="76" y="246" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="102" y="284" class="card-t">3-Tier Spaces &amp; Handover</text>
    <text x="102" y="312" class="card-b">Private Personal Space + Delegated Team</text>
    <text x="102" y="334" class="card-b">Spaces + Company Commons. Atomic</text>
    <text x="102" y="356" class="card-b">privacy-preserving offboarding handover.</text>

    <rect x="460" y="246" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="486" y="284" class="card-t">Hybrid RAG &amp; Gap Radar</text>
    <text x="486" y="312" class="card-b">BM25 + pgvector BGE-M3 + Rerank, table</text>
    <text x="486" y="334" class="card-b">fidelity, clickable page citations, ACL</text>
    <text x="486" y="356" class="card-b">revocation &amp; unanswered-query clustering.</text>

    <rect x="844" y="246" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="870" y="284" class="card-t">ERP / CRM &amp; L2 Writeback</text>
    <text x="870" y="312" class="card-b">Governed Semantic Views, SQL AST guard,</text>
    <text x="870" y="334" class="card-b">OAuth2 OBO Row-Level Security &amp; human</text>
    <text x="870" y="356" class="card-b">L2 diff approval with idempotent receipts.</text>

    <rect x="76" y="402" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="102" y="440" class="card-t">Air-Gapped Sandbox &amp; Brand Kit</text>
    <text x="102" y="468" class="card-b">Zero-K8s Docker Compose isolated sandbox</text>
    <text x="102" y="490" class="card-b">mounting official .pptx / .docx / .xlsx</text>
    <text x="102" y="512" class="card-b">templates + HMAC Webhook event triggers.</text>

    <rect x="460" y="402" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="486" y="440" class="card-t">Decoupled Agents &amp; DLP</text>
    <text x="486" y="468" class="card-b">Connect Dify, Coze, LangGraph, A2A &amp; MCP</text>
    <text x="486" y="490" class="card-b">without sharing LLM keys. Reversible PII</text>
    <text x="486" y="512" class="card-b">&amp; floor-price tokenization on egress.</text>

    <rect x="844" y="402" width="360" height="134" rx="16" fill="#ffffff" stroke="#d5e1d9"/>
    <text x="870" y="440" class="card-t">LLM Gateway &amp; Golden Evals</text>
    <text x="870" y="468" class="card-b">6 logical tiers with 3s fallback, dual-track</text>
    <text x="870" y="490" class="card-b">quality monitor, scheduled Skill market &amp;</text>
    <text x="870" y="512" class="card-b">pre-change Golden Regression Eval suites.</text>
  </g>

  <!-- Footer -->
  <text x="76" y="592" class="foot-txt">Go 1.26 · Temporal · PostgreSQL + pgvector · React 19 · Docker Compose</text>
  <text x="1204" y="592" text-anchor="end" class="foot-txt">github.com/slientwind/agent-alliance</text>
</svg>
