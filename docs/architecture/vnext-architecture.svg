  <rect x="36" y="210" width="1328" height="122" rx="14" fill="#ffffff" stroke="#dce3dd" filter="url(#shadow)"/>
  <text x="54" y="232" class="t-layer">02 · 控制面、协同与安全治理（Go API）</text>

