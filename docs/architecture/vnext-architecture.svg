  <!-- ==================== LAYER 1: CLIENTS ==================== -->
  <rect x="36" y="84" width="1328" height="98" rx="14" fill="#ffffff" stroke="#dce3dd" filter="url(#shadow)"/>
  <text x="54" y="106" class="t-layer">01 · 多端入口与协同触点</text>

  <!-- Card 1.1 -->
