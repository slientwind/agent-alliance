  <rect x="980" y="461" width="368" height="56" rx="10" fill="#ffffff" stroke="#c2daeb"/>
  <text x="994" y="482" class="t-card-h">边界观测与出站安全控制</text>
  <text x="994" y="501" class="t-card-b">UI 出站域名白名单 + SSRF 防护 · 耗时/状态监控 · 可选用量回传解析</text>

