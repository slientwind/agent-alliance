  <text x="388" y="627" class="t-card-b">独立 preview-internal 隔离预览与文本抽取</text>
  <text x="388" y="646" class="t-card-b">只读根 · cap_drop ALL · 硬 CPU/内存限制</text>

  <!-- Card 4.3: MCP & Enterprise Knowledge -->
  <rect x="708" y="560" width="312" height="114" rx="14" fill="#ffffff" stroke="#d5e2da" filter="url(#shadow)"/>
