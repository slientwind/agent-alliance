<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" fill="none">
  <defs>
    <style>
      .t-h1 { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #1a241f; }
      .t-sub { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #55625b; }
      .t-layer { font: 700 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #205a45; letter-spacing: 0.4px; }
      .t-layer-blue { font: 700 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #255d87; letter-spacing: 0.4px; }
      .t-card-h { font: 650 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #1d2621; }
      .t-card-b { font: 400 11.8px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #55615b; }
      .t-pill { font: 600 11px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; }
      .t-foot { font: 400 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #6c7a72; }
    </style>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#152a1e" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2b6b53"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2c6b99"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#6b7a72"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1400" height="860" rx="18" fill="#f7f9f6"/>
  <rect x="0.75" y="0.75" width="1398.5" height="858.5" rx="17.25" stroke="#dce3dd" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="26" width="34" height="34" rx="9" fill="#205a45"/>
  <path d="M53 34 L55.5 40.5 L62 43 L55.5 45.5 L53 52 L50.5 45.5 L44 43 L50.5 40.5 Z" fill="#e6f4ec"/>
  <text x="82" y="42" class="t-h1">Agent Alliance · 企业版 Personal Agent 系统架构</text>
  <text x="82" y="62" class="t-sub">单企业独立 Docker Compose 自部署 · 冷热分离实时流 · 全局模型网关与外部 Agent 完全解耦</text>

  <!-- Legend -->
  <g transform="translate(888, 30)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#e6f1eb"/>
    <circle cx="14" cy="13" r="4" fill="#205a45"/>
    <text x="24" y="17" class="t-pill" fill="#1b4d3a">平台核心能力</text>

    <rect x="122" y="0" width="116" height="26" rx="13" fill="#eaf2f8"/>
    <circle cx="136" cy="13" r="4" fill="#255d87"/>
    <text x="146" y="17" class="t-pill" fill="#255d87">外部独立解耦</text>

    <rect x="248" y="0" width="114" height="26" rx="13" fill="#fbf3e4"/>
    <circle cx="262" cy="13" r="4" fill="#925715"/>
    <text x="272" y="17" class="t-pill" fill="#925715">断网隔离执行</text>

    <rect x="372" y="0" width="104" height="26" rx="13" fill="#ffffff" stroke="#d5ddd7"/>
    <line x1="383" y1="13" x2="401" y2="13" stroke="#2c6b99" stroke-width="1.8" stroke-dasharray="3 2.5"/>
    <text x="407" y="17" class="t-pill" fill="#55615b">事件/异步流</text>
