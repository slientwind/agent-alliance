  <text x="68" y="156" class="t-card-b">对话与 Canvas · 团队协同 · 左聊右测构建 · 生态市场 · 全屏 /admin</text>

  <!-- Card 1.2 -->
  <rect x="492" y="116" width="420" height="54" rx="10" fill="#f7faf8" stroke="#cfe0d6"/>
  <text x="508" y="137" class="t-card-h">企业 IM 移动协同渠道</text>
  <text x="508" y="156" class="t-card-b">飞书（首发）· 钉钉 Stream · Slack 单聊/待办卡片 · 幂等审批与告警推送</text>

  <!-- Card 1.3 -->
  <rect x="928" y="116" width="420" height="54" rx="10" fill="#f7faf8" stroke="#cfe0d6"/>
  <text x="944" y="137" class="t-card-h">Open API 与应用委托入口</text>
  <text x="944" y="156" class="t-card-b">单 Agent / 协作方案发布为标准服务 · 应用/成员双身份 · 签名状态流与下载</text>

  <!-- Connectors L1 -> L2 -->
  <line x1="264" y1="182" x2="264" y2="206" stroke="#2b6b53" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="700" y1="182" x2="700" y2="206" stroke="#2b6b53" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="1138" y1="182" x2="1138" y2="206" stroke="#2b6b53" stroke-width="1.8" marker-end="url(#arrow-green)"/>

