      .t-card-b { font: 400 11.6px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #55615b; }
      .t-pill { font: 600 11px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; }
      .t-foot { font: 400 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #6c7a72; }
