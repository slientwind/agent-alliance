  <text x="388" y="584" class="t-card-h" fill="#824d12">高可信工具与隔离预览容器</text>
  <rect x="610" y="569" width="66" height="22" rx="11" fill="#f7e8cc"/>
  <text x="643" y="584" text-anchor="middle" class="t-pill" fill="#824d12">零凭据</text>
