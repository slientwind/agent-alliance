  <rect x="36" y="560" width="320" height="114" rx="14" fill="#fdf8ef" stroke="#e6cfa5" filter="url(#shadow)"/>
  <text x="52" y="584" class="t-card-h" fill="#824d12">04 · Docker Compose 隔离沙箱池</text>
  <rect x="268" y="569" width="72" height="22" rx="11" fill="#f7e8cc"/>
  <text x="304" y="584" text-anchor="middle" class="t-pill" fill="#824d12">断网隔离</text>
  <text x="52" y="608" class="t-card-b">独立 sandbox-internal (internal: true)</text>
  <text x="52" y="627" class="t-card-b">只读挂载原件 · Python 数据分析与图表</text>
  <text x="52" y="646" class="t-card-b">Word / Excel / PPT / PDF 生成与 Skill 运行</text>

  <!-- Card 4.2: Deterministic Tools & Preview -->
