  <text x="328" y="285" class="t-card-b">热流 Token / 思考 / 在线态推送</text>
  <text x="328" y="303" class="t-card-b">冷事实 PG 游标重放 · 零轮询放大</text>

  <rect x="576" y="244" width="246" height="74" rx="10" fill="#f6f9f7" stroke="#d5e2da"/>
