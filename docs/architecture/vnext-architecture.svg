  <text x="540" y="383" class="t-layer">03B · 全局模型网关与生态扫描引擎</text>

  <rect x="538" y="395" width="392" height="56" rx="10" fill="#f5faf7" stroke="#c8ddd0"/>
  <text x="552" y="416" class="t-card-h">内部全局模型网关（Internal LLM Gateway）</text>
  <text x="552" y="435" class="t-card-b">6 能力档位 · 主备容灾 Fallback · 精确微元计价 · 不向外部发 Key</text>

  <rect x="538" y="461" width="392" height="56" rx="10" fill="#f5faf7" stroke="#c8ddd0"/>
  <text x="552" y="482" class="t-card-h">Skill &amp; Agent 生态定期扫描器（Ecosystem Scanner）</text>
  <text x="552" y="501" class="t-card-b">定时抓取官方 MCP / Skill / A2A · 许可安全体检 · SHA-256 缓存加载</text>

