  <text x="590" y="285" class="t-card-b">任务拉人分工 · Canvas 锚点评论</text>
  <text x="590" y="303" class="t-card-b">@同事派单 · 乐观锁防并发覆盖</text>

  <rect x="838" y="244" width="246" height="74" rx="10" fill="#f6f9f7" stroke="#d5e2da"/>
  <text x="852" y="266" class="t-card-h">对话式构建器 Studio</text>
  <text x="852" y="285" class="t-card-b">Meta-Agent 左聊右测 + 标杆反推</text>
  <text x="852" y="303" class="t-card-b">个人私有零审批 / 团队 / 全企发布</text>

  <rect x="1100" y="244" width="248" height="74" rx="10" fill="#f6f9f7" stroke="#d5e2da"/>
  <text x="1114" y="266" class="t-card-h">企业管理与监控 API</text>
