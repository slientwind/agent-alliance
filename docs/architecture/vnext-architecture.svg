<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890" fill="none">
  <defs>
    <style>
      .t-h1 { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #1a241f; }
      .t-sub { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #55625b; }
      .t-layer { font: 700 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #205a45; letter-spacing: 0.4px; }
      .t-layer-blue { font: 700 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", sans-serif; fill: #255d87; letter-spacing: 0.4px; }
