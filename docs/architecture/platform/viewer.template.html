<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Alliance · 企业平台工程全景</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#163141}body{display:flex;flex-direction:column;background:#eef2f4}header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 18px;background:white;border-bottom:1px solid #c9d7dc}header strong{font-size:17px;margin-right:auto}input,select,button{font:inherit;color:inherit;border:1px solid #afc2cb;border-radius:5px;background:#fff;padding:5px 9px}button{cursor:pointer}button:hover,button:focus-visible{background:#eaf2f5}input{width:180px}select{max-width:210px}#zvalue{min-width:43px;text-align:center;font-variant-numeric:tabular-nums}main{flex:1;display:flex;overflow:hidden}#viewport{flex:1;min-width:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;background:#e3e9ed;position:relative}#canvas{display:block;width:max-content;margin:0 auto;line-height:0}#canvas svg{display:block;max-width:none}#canvas .card,#canvas .module,#canvas .research{cursor:pointer}#canvas .picked>rect:first-of-type{stroke:#0e354d;stroke-width:5px}#canvas .neighbor>rect:first-of-type{stroke:#408c9e;stroke-width:3px}#canvas .hot{stroke-width:5px}#canvas .result>rect:first-of-type{stroke:#bb792a;stroke-width:5px}
aside{width:min(390px,39vw);overflow:auto;background:#fff;border-left:1px solid #bbcbd2;padding:20px;line-height:1.6}aside[hidden]{display:none}aside h2{font-size:22px;line-height:1.28;margin:8px 0 16px}aside h3{font-size:15px;margin:22px 0 7px}aside ul{padding-left:19px;margin:5px 0}aside li{margin:5px 0}aside .close{float:right}aside details{border-top:1px solid #dce5e9;padding:9px 0}aside summary{cursor:pointer}aside .rel{display:block;text-align:left;width:100%;margin:5px 0;font-size:14px}aside a{color:#205f77;overflow-wrap:anywhere}aside small{color:#526a75}#matches{max-width:150px}#matches:empty{display:none}
@media(max-width:740px){header{padding:6px;gap:4px}header strong{width:100%}aside{position:absolute;right:0;bottom:0;max-height:61vh;width:min(92vw,390px);box-shadow:0 -4px 24px #162e4230}#search{width:116px}#module{max-width:140px}}
@media print{header,aside{display:none!important}html,body,main,#viewport,#canvas{display:block;height:auto;overflow:visible;background:white}#canvas,#canvas svg{width:100%!important;height:auto!important}}
</style>
<header><strong>企业 Agent 平台工程全景</strong><label><input id="search" aria-label="搜索架构组件" placeholder="搜索组件或契约" type="search"></label><button id="matches" title="定位下一个结果" aria-live="polite"></button><select id="module" aria-label="定位架构模块"><option value="">定位模块…</option></select><button id="less" aria-label="缩小">−</button><span id="zvalue"></span><button id="more" aria-label="放大">＋</button><button id="fit">全图</button><button id="width">适合宽度</button></header>
<main><div id="viewport" tabindex="0" aria-label="架构画布，可滚动和缩放"><div id="canvas"><!-- CANVAS --></div></div><aside id="detail" hidden aria-label="架构节点详情"></aside></main>
<script id="model" type="application/json">/* PAYLOAD */</script>
<script>
'use strict';
const M=JSON.parse(document.querySelector('#model').textContent);
const $=q=>document.querySelector(q), view=$('#viewport'), svg=$('#canvas svg'), pane=$('#detail'), sel=$('#module'), lookup=$('#search');
let scale=1,active='',hits=[],cursor=0;
const dom=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const attr=(id)=>document.getElementById(id);
function setZoom(s,cx,cy){scale=Math.max(.10,Math.min(2.8,s));svg.style.width=(M.width*scale)+'px';svg.style.height=(M.height*scale)+'px';$('#zvalue').textContent=Math.round(scale*100)+'%';if(cx!=null){view.scrollLeft=cx*scale-view.clientWidth/2;view.scrollTop=cy*scale-view.clientHeight/2}}
function centered(s){setZoom(s,(view.scrollLeft+view.clientWidth/2)/scale,(view.scrollTop+view.clientHeight/2)/scale)}
function fit(){setZoom(Math.min((view.clientWidth-8)/M.width,(view.clientHeight-8)/M.height));view.scrollTo(0,0)}
function focusBox(box){const [x,y,w,h]=box;setZoom(Math.min((view.clientWidth-56)/w,(view.clientHeight-58)/h,1.35),x+w/2,y+h/2)}
function clean(){svg.querySelectorAll('.picked,.neighbor,.hot').forEach(e=>e.classList.remove('picked','neighbor','hot'))}
function list(items,parent=pane){const ul=dom('ul');for(const it of items)ul.append(dom('li',it));parent.append(ul)}
function details(label,items){const d=dom('details');d.append(dom('summary',label));list(items,d);pane.append(d)}
function closePanel(){pane.hidden=true;active='';clean()}
function panelStart(name){pane.replaceChildren();pane.hidden=false;const close=dom('button','关闭','close');close.onclick=closePanel;pane.append(close,dom('h2',name));pane.scrollTo(0,0)}
function originalLinks(info,parent){const wrap=dom('p'),a=dom('a','打开原有详图');a.href=info.url;a.target='_blank';a.rel='noopener';wrap.append(a);parent.append(wrap);if(info.links.length){const ul=dom('ul');for(const ref of info.links){const li=dom('li'),link=dom('a',ref.title);link.href=ref.url;link.target='_blank';link.rel='noopener';li.append(link);ul.append(li)}parent.append(ul)}}
function sourceSheets(keys){for(const k of [...new Set(keys)]){const s=M.sources[k];if(s){details('原设计 · '+s.title,s.lines);originalLinks(s,pane.lastElementChild)}}}
function group(key,zoom=true){const g=M.groups[key];if(!g)return;active=key;clean();panelStart(g.title);pane.append(dom('small',g.owner),dom('h3','模块内组件'));for(const id of g.cards){const b=dom('button',M.cards[id].title,'rel');b.onclick=()=>card(id,true);pane.append(b)}const keys=[...g.sources,...g.cards.flatMap(id=>(M.notes[id]||[]).map(n=>n.sheet))];if(keys.length){pane.append(dom('h3','历次设计的接口与注记'));sourceSheets(keys)}sel.value=key;attr('g-'+key).classList.add('picked');if(zoom)focusBox(g.box)}
function card(key,zoom=false){const c=M.cards[key];if(!c)return;active=key;clean();panelStart(c.title);const labels={live:'已有实现',extend:'已有基础，设计扩展',new:'拟新增'};pane.append(dom('small',M.groups[c.group].title+' / '+labels[c.status]));list(c.lines);attr('n-'+key).classList.add('picked');const rs=M.edges.map((e,i)=>[e,i]).filter(([e])=>e.a===key||e.b===key);if(rs.length)pane.append(dom('h3','相连的组件与契约'));for(const [e,i] of rs){const out=e.a===key,id=out?e.b:e.a;const b=dom('button',(out?'→ ':'← ')+M.cards[id].title+' · '+(e.code?e.code+' ':'')+e.label,'rel');b.onclick=()=>card(id,true);pane.append(b);attr('n-'+id).classList.add('neighbor');svg.querySelector('[data-index="'+i+'"]')?.classList.add('hot')}
const notes=M.notes[key]||[];if(notes.length){pane.append(dom('h3','原组件说明'));for(const note of notes)details(note.lines[0]+' · '+M.sources[note.sheet].title,note.lines.slice(1))}
const back=dom('button','查看所属模块','rel');back.onclick=()=>group(c.group);pane.append(back);sel.value=c.group;if(zoom||!visible(c.box))focusBox(c.box)}
function visible([x,y,w,h]){return x*scale>=view.scrollLeft&&y*scale>=view.scrollTop&&(x+w)*scale<=view.scrollLeft+view.clientWidth&&(y+h)*scale<=view.scrollTop+view.clientHeight}
for(const g of Object.values(M.groups)){const o=dom('option',g.title);o.value=g.id;sel.append(o)}
function research(key){const entry=M.sources[key];if(!entry)return;clean();panelStart(entry.title);list(entry.lines.filter((v,i)=>i>2&&i<entry.lines.length-1));originalLinks(entry,pane)}
sel.onchange=()=>group(sel.value);svg.onclick=e=>{const ref=e.target.closest('.research');if(ref){research(ref.dataset.ref);return}const c=e.target.closest('.card');if(c){card(c.dataset.key);return}const g=e.target.closest('.module');if(g)group(g.dataset.module)};
svg.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.research')){e.preventDefault();research(e.target.dataset.ref);return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();card(e.target.dataset.key,true)}};
const searchable=Object.values(M.cards).map(c=>[c.id,[c.title,c.id,...c.lines,...(M.notes[c.id]||[]).flatMap(n=>n.lines),...M.edges.filter(e=>e.a===c.id||e.b===c.id).map(e=>(e.code||'')+' '+e.label)].join(' ').toLowerCase()]);
function nextMatch(){if(hits.length)card(hits[cursor++%hits.length],true)}
lookup.oninput=()=>{const q=lookup.value.trim().toLowerCase();hits=q?searchable.filter(([,s])=>s.includes(q)).map(([k])=>k):[];cursor=0;svg.querySelectorAll('.result').forEach(e=>e.classList.remove('result'));hits.forEach(k=>attr('n-'+k).classList.add('result'));$('#matches').textContent=q?(hits.length?hits.length+' 处 · 定位':'0 处'):''};lookup.onkeydown=e=>{if(e.key==='Enter')nextMatch()};$('#matches').onclick=nextMatch;
$('#less').onclick=()=>centered(scale/1.3);$('#more').onclick=()=>centered(scale*1.3);$('#fit').onclick=()=>{closePanel();sel.value='';fit()};$('#width').onclick=()=>{setZoom((view.clientWidth-8)/M.width);view.scrollTo(0,0)};
let drag;view.addEventListener('pointerdown',e=>{if(e.button!==0||e.pointerType==='touch'||e.target.closest('.card,.module,.research'))return;drag={x:e.clientX,y:e.clientY,left:view.scrollLeft,top:view.scrollTop};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(drag){view.scrollLeft=drag.left+drag.x-e.clientX;view.scrollTop=drag.top+drag.y-e.clientY}});view.addEventListener('lostpointercapture',()=>{drag=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();lookup.blur()}});view.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const r=view.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,x=(view.scrollLeft+px)/scale,y=(view.scrollTop+py)/scale;setZoom(scale*Math.exp(-e.deltaY*.012));view.scrollLeft=x*scale-px;view.scrollTop=y*scale-py},{passive:false});setZoom((view.clientWidth-8)/M.width);
</script></html>
