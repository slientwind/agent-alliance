<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-builder · Agent 构建模块 · 从成员草稿到可执行修订</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">Agent 构建模块 · 从成员草稿到可执行修订</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">构建模块拥有定义、依赖、评测与发布。资源目录提供可用能力，Runtime 只接受已发布清单与本次运行的有效授权。</text><rect x="32" y="126" width="360" height="675" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="152" font-size="19" font-weight="680" fill="#36596a">作者、资源与样例</text><rect x="444" y="126" width="696" height="675" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="458" y="152" font-size="19" font-weight="680" fill="#36596a">独立构建模块  /  Go API</text><rect x="1192" y="126" width="376" height="675" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1206" y="152" font-size="19" font-weight="680" fill="#36596a">执行与发布消费者</text><g class="node" data-name="成员工作台"><rect x="48" y="192" width="329" height="113" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="222" font-size="21" font-weight="680" fill="#214f76">成员工作台</text><text x="62" y="248" font-size="16" fill="#172f42">职责、输入输出、样例、维护人</text><text x="62" y="271" font-size="16" fill="#172f42">比较试跑结果，保存修订并申请发布</text></g><g class="node" data-name="能力与连接目录"><rect x="48" y="379" width="329" height="113" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="409" font-size="21" font-weight="680" fill="#214f76">能力与连接目录</text><text x="62" y="435" font-size="16" fill="#172f42">内置工具、已发布子 Agent、Skill</text><text x="62" y="458" font-size="16" fill="#172f42">第三方先完成卡片导入和操作级试跑</text></g><g class="node" data-name="评测与发布角色"><rect x="48" y="566" width="329" height="113" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="596" font-size="21" font-weight="680" fill="#174f45">评测与发布角色</text><text x="62" y="622" font-size="16" fill="#172f42">作者提交、审核人核验证据</text><text x="62" y="645" font-size="16" fill="#172f42">按现有发布权限决定发布或退回</text></g><g class="node" data-name="DraftService / 草稿与协同编辑"><rect x="462" y="184" width="660" height="104" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="476" y="214" font-size="21" font-weight="680" fill="#214f76">DraftService / 草稿与协同编辑</text><text x="476" y="240" font-size="16" fill="#172f42">记录 owner、base_revision、指令、模型、I/O 契约及样例引用</text><text x="476" y="263" font-size="16" fill="#172f42">并发写入校验基线；改动形成新修订，旧评测保留原归属</text></g><g class="node" data-name="DependencyCompiler"><rect x="462" y="342" width="307" height="120" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="476" y="372" font-size="21" font-weight="680" fill="#784b16">DependencyCompiler</text><text x="476" y="398" font-size="16" fill="#172f42">解析模型、工具、Skill、子 Agent</text><text x="476" y="421" font-size="16" fill="#172f42">固定修订；检查环、契约与范围</text></g><g class="node" data-name="TrialCoordinator"><rect x="815" y="342" width="307" height="120" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="829" y="372" font-size="21" font-weight="680" fill="#214f76">TrialCoordinator</text><text x="829" y="398" font-size="16" fill="#172f42">绑定环境、样例、预算及修订</text><text x="829" y="421" font-size="16" fill="#172f42">委托受控试跑，保留各次证据</text></g><g class="node" data-name="BuildManifest"><rect x="462" y="534" width="307" height="120" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="476" y="564" font-size="21" font-weight="680" fill="#784b16">BuildManifest</text><text x="476" y="590" font-size="16" fill="#172f42">Agent 修订、依赖哈希、I/O</text><text x="476" y="613" font-size="16" fill="#172f42">试跑配置、权限需求与证据键</text></g><g class="node" data-name="ReleaseManager"><rect x="815" y="534" width="307" height="120" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="829" y="564" font-size="21" font-weight="680" fill="#214f76">ReleaseManager</text><text x="829" y="590" font-size="16" fill="#172f42">重验当前基线、必要检查</text><text x="829" y="613" font-size="16" fill="#172f42">记录申请、发布决定或退回</text></g><g class="node" data-name="已发布 AgentRevision / 版本指针"><rect x="462" y="706" width="660" height="77" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="476" y="736" font-size="21" font-weight="680" fill="#214f76">已发布 AgentRevision / 版本指针</text><text x="476" y="762" font-size="16" fill="#172f42">固化发布工件；灰度和复合依赖锁为提案，回退选择兼容的已验证版本</text></g><g class="node" data-name="试跑执行端"><rect x="1210" y="192" width="340" height="113" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1224" y="222" font-size="21" font-weight="680" fill="#214f76">试跑执行端</text><text x="1224" y="248" font-size="16" fill="#172f42">按试跑用途取得凭据与预算</text><text x="1224" y="271" font-size="16" fill="#172f42">与正式运行分开，返回证据及用量</text></g><g class="node" data-name="验证存储"><rect x="1210" y="379" width="340" height="113" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1224" y="409" font-size="21" font-weight="680" fill="#174f45">验证存储</text><text x="1224" y="435" font-size="16" fill="#172f42">样例引用、文件、检查项与证据</text><text x="1224" y="458" font-size="16" fill="#172f42">证据可撤回，发布时再验当前状态</text></g><g class="node" data-name="AgentResolver / Runtime"><rect x="1210" y="566" width="340" height="113" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1224" y="596" font-size="21" font-weight="680" fill="#214f76">AgentResolver / Runtime</text><text x="1224" y="622" font-size="16" fill="#172f42">项目绑定明确版本；恢复时复权</text><text x="1224" y="645" font-size="16" fill="#172f42">普通停用、紧急停止分别处理</text></g><polyline points="377,246 462,246" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="377,437 462,437" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="377,620 414,620 414,678 966,678 966,654" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="615,288 615,342" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="742,534 742,490 972,490 972,462" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="794" y="482" font-size="15" font-weight="570" fill="#146859">锁定清单</text><polyline points="615,462 615,534" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="769,590 815,590" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1122,399 1160,399 1160,247 1210,247" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1388,305 1388,379" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="1210,436 1170,436 1170,596 1122,596" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="968,654 968,706" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1122,742 1162,742 1162,625 1210,625" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1171" y="680" font-size="15" font-weight="570" fill="#146859">解析</text><rect x="32" y="845" width="1536" height="141" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="871" font-size="19" font-weight="680" fill="#36596a">存储所有权与跨模块契约</text><g class="node" data-name="草稿与修订"><rect x="48" y="891" width="348" height="75" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="921" font-size="21" font-weight="680" fill="#174f45">草稿与修订</text><text x="62" y="947" font-size="16" fill="#172f42">agents、agent_revisions 与基线版本</text></g><g class="node" data-name="试跑与证据"><rect x="433" y="891" width="348" height="75" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="447" y="921" font-size="21" font-weight="680" fill="#174f45">试跑与证据</text><text x="447" y="947" font-size="16" fill="#172f42">validations、agent_checks、评审记录</text></g><g class="node" data-name="发布决定"><rect x="818" y="891" width="348" height="75" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="832" y="921" font-size="21" font-weight="680" fill="#174f45">发布决定</text><text x="832" y="947" font-size="16" fill="#172f42">agent_release_requests 与已发布修订</text></g><g class="node" data-name="拟增依赖清单"><rect x="1203" y="891" width="348" height="75" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1217" y="921" font-size="21" font-weight="680" fill="#784b16">拟增依赖清单</text><text x="1217" y="947" font-size="16" fill="#172f42">按哈希绑定 Skill、子 Agent 与工具契约</text></g><text x="42" y="1028" font-size="18" font-weight="550" fill="#172f42">发布清单描述所需权限。运行时以调用者、项目、数据和目标的当前授权取交集；模板与已发布版本均不携带个人凭据。</text><text x="44" y="1072" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1072" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>