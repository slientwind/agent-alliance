<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-data · 上下文引擎 · 短期状态、长期记忆、知识与 Skill</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1090" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">上下文引擎 · 短期状态、长期记忆、知识与 Skill</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">四类输入分别由业务所有者授权。每轮装配一个可复核的上下文版本；技能正文、检索片段和记忆修订有各自的失效条件。</text><rect x="34" y="137" width="366" height="544" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="163" font-size="19" font-weight="680" fill="#36596a">短期状态</text><g class="node" data-name="项目消息 / 调用观察"><rect x="42" y="184" width="350" height="105" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="56" y="214" font-size="21" font-weight="680" fill="#174f45">项目消息 / 调用观察</text><text x="56" y="240" font-size="16" fill="#172f42">messages、invocations、tool_call_id</text><text x="56" y="263" font-size="16" fill="#172f42">持有项目与运行的访问范围</text></g><g class="node" data-name="回合快照 / 摘要"><rect x="42" y="358" width="350" height="105" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="56" y="388" font-size="21" font-weight="680" fill="#784b16">回合快照 / 摘要</text><text x="56" y="414" font-size="16" fill="#172f42">run + branch + turn，高水位</text><text x="56" y="437" font-size="16" fill="#172f42">保留工具请求与结果配对</text></g><g class="node" data-name="装配最近窗口"><rect x="42" y="532" width="350" height="112" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="56" y="562" font-size="21" font-weight="680" fill="#784b16">装配最近窗口</text><text x="56" y="588" font-size="16" fill="#172f42">读近期消息、待办和未决调用</text><text x="56" y="611" font-size="16" fill="#172f42">摘要绑定覆盖区间，过期则重建</text></g><polyline points="218,289 218,358" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="230" y="331" font-size="15" font-weight="570" fill="#146859">写入或固定修订</text><polyline points="218,463 218,532" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="230" y="509" font-size="15" font-weight="570" fill="#146859">按范围选取</text><polyline points="218,644 218,718" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><rect x="423" y="137" width="366" height="544" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="437" y="163" font-size="19" font-weight="680" fill="#36596a">长期记忆</text><g class="node" data-name="成员 / 团队维护"><rect x="431" y="184" width="350" height="105" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="445" y="214" font-size="21" font-weight="680" fill="#214f76">成员 / 团队维护</text><text x="445" y="240" font-size="16" fill="#172f42">显式个人偏好、已确认的团队规则</text><text x="445" y="263" font-size="16" fill="#172f42">推断仅作本轮建议，明确授权才保存</text></g><g class="node" data-name="可修订记忆条目"><rect x="431" y="358" width="350" height="105" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="445" y="388" font-size="21" font-weight="680" fill="#214f76">可修订记忆条目</text><text x="445" y="414" font-size="16" fill="#172f42">已有 preferences 和规则修订</text><text x="445" y="437" font-size="16" fill="#172f42">通用记忆拟增作用域、来源和有效期</text></g><g class="node" data-name="召回有效记忆"><rect x="431" y="532" width="350" height="112" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="445" y="562" font-size="21" font-weight="680" fill="#784b16">召回有效记忆</text><text x="445" y="588" font-size="16" fill="#172f42">先筛成员、团队、授权和有效期</text><text x="445" y="611" font-size="16" fill="#172f42">再按相关性与新鲜度选取</text></g><polyline points="607,289 607,358" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="619" y="331" font-size="15" font-weight="570" fill="#146859">写入或固定修订</text><polyline points="607,463 607,532" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="619" y="509" font-size="15" font-weight="570" fill="#146859">按范围选取</text><polyline points="607,644 607,718" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><rect x="812" y="137" width="366" height="544" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="826" y="163" font-size="19" font-weight="680" fill="#36596a">版本化知识</text><g class="node" data-name="资料摄取与抽取"><rect x="820" y="184" width="350" height="105" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="834" y="214" font-size="21" font-weight="680" fill="#174f45">资料摄取与抽取</text><text x="834" y="240" font-size="16" fill="#172f42">对象卷存原件；业务库存来源修订</text><text x="834" y="263" font-size="16" fill="#172f42">抽取文本保留页码或位置线索</text></g><g class="node" data-name="索引 Worker"><rect x="820" y="358" width="350" height="105" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="834" y="388" font-size="21" font-weight="680" fill="#174f45">索引 Worker</text><text x="834" y="414" font-size="16" fill="#172f42">source_passages + 编码器修订</text><text x="834" y="437" font-size="16" fill="#172f42">可选 BGE 写 pgvector，可重算</text></g><g class="node" data-name="按版本检索"><rect x="820" y="532" width="350" height="112" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="834" y="562" font-size="21" font-weight="680" fill="#174f45">按版本检索</text><text x="834" y="588" font-size="16" fill="#172f42">限定项目已授权的原件修订</text><text x="834" y="611" font-size="16" fill="#172f42">输出片段、来源 ID、版本和偏移</text></g><polyline points="996,289 996,358" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1008" y="331" font-size="15" font-weight="570" fill="#146859">写入或固定修订</text><polyline points="996,463 996,532" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1008" y="509" font-size="15" font-weight="570" fill="#146859">按范围选取</text><polyline points="996,644 996,718" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><rect x="1201" y="137" width="366" height="544" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1215" y="163" font-size="19" font-weight="680" fill="#36596a">技能与工具</text><g class="node" data-name="Agent 资源发布"><rect x="1209" y="184" width="350" height="105" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1223" y="214" font-size="21" font-weight="680" fill="#214f76">Agent 资源发布</text><text x="1223" y="240" font-size="16" fill="#172f42">平台自研、成员构建、外部导入</text><text x="1223" y="263" font-size="16" fill="#172f42">发布 Agent 修订，拟固定 Skill 依赖</text></g><g class="node" data-name="SkillRevision / Manifest"><rect x="1209" y="358" width="350" height="105" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1223" y="388" font-size="21" font-weight="680" fill="#784b16">SkillRevision / Manifest</text><text x="1223" y="414" font-size="16" fill="#172f42">对象卷存包；目录拟存哈希与依赖</text><text x="1223" y="437" font-size="16" fill="#172f42">工具 schema 来自有权限的能力目录</text></g><g class="node" data-name="SkillLoader"><rect x="1209" y="532" width="350" height="112" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1223" y="562" font-size="21" font-weight="680" fill="#784b16">SkillLoader</text><text x="1223" y="588" font-size="16" fill="#172f42">先读名称和摘要，选中才读正文</text><text x="1223" y="611" font-size="16" fill="#172f42">脚本按工具权限独立核验</text></g><polyline points="1385,289 1385,358" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1397" y="331" font-size="15" font-weight="570" fill="#146859">写入或固定修订</text><polyline points="1385,463 1385,532" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1397" y="509" font-size="15" font-weight="570" fill="#146859">按范围选取</text><polyline points="1385,644 1385,718" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><polyline points="218,718 1385,718" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><polyline points="799,718 799,758" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><g class="node" data-name="ContextBuilder.Build  →  ModelInput + DependencySet"><rect x="302" y="758" width="991" height="111" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="316" y="788" font-size="21" font-weight="680" fill="#784b16">ContextBuilder.Build  →  ModelInput + DependencySet</text><text x="316" y="814" font-size="16" fill="#172f42">有序装配：运行约束与授权 schema  ·  已确认目标  ·  未闭合调用  ·  近期消息  ·  按需引用</text><text x="316" y="837" font-size="16" fill="#172f42">优先保留约束和调用配对，预留输出空间。依赖清单记录 source / skill / memory 的版本与读取范围。</text></g><g class="node" data-name="下一次模型调用"><rect x="44" y="919" width="710" height="89" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="58" y="949" font-size="21" font-weight="680" fill="#214f76">下一次模型调用</text><text x="58" y="975" font-size="16" fill="#172f42">送入已绑定模型修订；按模型窗口计数，预算不足则停止。</text></g><g class="node" data-name="失效与恢复"><rect x="846" y="919" width="710" height="89" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="860" y="949" font-size="21" font-weight="680" fill="#784b16">失效与恢复</text><text x="860" y="975" font-size="16" fill="#172f42">撤权、来源撤回或记忆更正使相关投影失效；恢复前重新装配。</text></g><polyline points="556,869 556,919" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1028,869 1028,919" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="44" y="1062" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1062" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>