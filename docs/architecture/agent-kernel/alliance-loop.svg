<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-loop · Agent Loop · 工作流、回合驱动与持久等待</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1080" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">Agent Loop · 工作流、回合驱动与持久等待</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">一个已确认的计划节点可以推进多个回合。Workflow 只依据活动返回的小型结果调度；允许访问模型、数据库和工具的代码运行在 Activity。</text><rect x="32" y="123" width="1528" height="194" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="149" font-size="19" font-weight="680" fill="#36596a">Temporal Workflow  /  确定性调度</text><g class="node" data-name="Collaborate / scheduleDAG"><rect x="50" y="171" width="389" height="108" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="64" y="201" font-size="21" font-weight="680" fill="#174f45">Collaborate / scheduleDAG</text><text x="64" y="227" font-size="16" fill="#172f42">加载有版本的计划拓扑，调度就绪节点</text><text x="64" y="250" font-size="16" fill="#172f42">固定执行路径继续使用 ExecuteStep</text></g><g class="node" data-name="LoopController（拟新增）"><rect x="561" y="171" width="467" height="108" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="575" y="201" font-size="21" font-weight="680" fill="#784b16">LoopController（拟新增）</text><text x="575" y="227" font-size="16" fill="#172f42">按分支调度 AdvanceTurn 或 ExecuteAction</text><text x="575" y="250" font-size="16" fill="#172f42">持久等待控制信号、业务待办与计时器</text></g><g class="node" data-name="回合调度结果"><rect x="1147" y="171" width="393" height="108" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1161" y="201" font-size="21" font-weight="680" fill="#784b16">回合调度结果</text><text x="1161" y="227" font-size="16" fill="#172f42">再推进 / 要派发 / 要等待 / 步骤结束</text><text x="1161" y="250" font-size="16" fill="#172f42">只传标识、控制修订、状态和引用</text></g><polyline points="439,219 561,219" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="454" y="208" font-size="15" font-weight="570" fill="#375c72">按路径选用</text><polyline points="1147,223 1028,223" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="1054" y="210" font-size="15" font-weight="570" fill="#785a82">读取结果</text><rect x="32" y="374" width="985" height="420" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="400" font-size="19" font-weight="680" fill="#36596a">Go Worker  /  每次 Activity 有界，业务操作独立落账</text><rect x="1072" y="374" width="488" height="420" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1086" y="400" font-size="19" font-weight="680" fill="#36596a">依赖与结果所有者</text><g class="node" data-name="AdvanceTurn / 推进一个模型回合"><rect x="51" y="430" width="444" height="114" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="65" y="460" font-size="21" font-weight="680" fill="#784b16">AdvanceTurn / 推进一个模型回合</text><text x="65" y="486" font-size="16" fill="#172f42">按分支与回合领取；先复用已存回复或决定</text><text x="65" y="509" font-size="16" fill="#172f42">调用 Harness；需要推理时经 Runtime 预占</text></g><g class="node" data-name="ExecuteAction / 处理一个决定"><rect x="555" y="430" width="441" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="569" y="460" font-size="21" font-weight="680" fill="#214f76">ExecuteAction / 处理一个决定</text><text x="569" y="486" font-size="16" fill="#172f42">按已存动作键复核权限、版本、预算及取消</text><text x="569" y="509" font-size="16" fill="#172f42">工具调用、子委托或远端 A2A 交各自适配器</text></g><g class="node" data-name="CommitTurn / 提交检查点"><rect x="51" y="622" width="444" height="111" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="65" y="652" font-size="21" font-weight="680" fill="#784b16">CommitTurn / 提交检查点</text><text x="65" y="678" font-size="16" fill="#172f42">比较基准版本，消费观察并记录动作与游标</text><text x="65" y="701" font-size="16" fill="#172f42">写入成功才允许下一次派发或返回终态</text></g><g class="node" data-name="观察与外部回执"><rect x="555" y="622" width="441" height="111" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="569" y="652" font-size="21" font-weight="680" fill="#214f76">观察与外部回执</text><text x="569" y="678" font-size="16" fill="#172f42">绑定 action / attempt / call_id，异步保留任务号</text><text x="569" y="701" font-size="16" fill="#172f42">可能已发而状态未知时进入核对</text></g><g class="node" data-name="构建、安全、记忆和资源目录"><rect x="1091" y="430" width="449" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1105" y="460" font-size="21" font-weight="680" fill="#214f76">构建、安全、记忆和资源目录</text><text x="1105" y="486" font-size="16" fill="#172f42">固定 Agent、Skill 和模型修订；使用前复权</text><text x="1105" y="509" font-size="16" fill="#172f42">缺失必要输入转等待，受限凭据仅在适配端</text></g><g class="node" data-name="人工待办 / 成果审核"><rect x="1091" y="622" width="449" height="111" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1105" y="652" font-size="21" font-weight="680" fill="#214f76">人工待办 / 成果审核</text><text x="1105" y="678" font-size="16" fill="#172f42">补件、批准、取消经业务事务提交后发信号</text><text x="1105" y="701" font-size="16" fill="#172f42">候选含证据与缺项，交付由审核人确认</text></g><polyline points="669,279 669,340 461,340 461,430" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="921,279 921,430" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1091,500 996,500" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="272,544 272,622" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="287" y="590" font-size="15" font-weight="570" fill="#375c72">记录本轮决定</text><polyline points="781,544 781,622" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="795" y="589" font-size="15" font-weight="570" fill="#785a82">同步结果或异步回执</text><polyline points="555,676 495,676" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="272,733 272,764 1040,764 1040,349 1340,349 1340,279" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="561" y="756" font-size="15" font-weight="560" fill="#785a82">返回业务检查点 / 等待原因</text><polyline points="1091,678 1053,678 1053,362 953,362 953,279" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><rect x="32" y="842" width="1528" height="133" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="868" font-size="19" font-weight="680" fill="#36596a">持久化与可观测性</text><g class="node" data-name="业务 PostgreSQL"><rect x="49" y="887" width="480" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="63" y="917" font-size="21" font-weight="680" fill="#214f76">业务 PostgreSQL</text><text x="63" y="943" font-size="16" fill="#172f42">回合、逻辑动作、尝试、观察、待办与预占</text></g><g class="node" data-name="对象卷 / 受控正文"><rect x="555" y="887" width="480" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="569" y="917" font-size="21" font-weight="680" fill="#214f76">对象卷 / 受控正文</text><text x="569" y="943" font-size="16" fill="#172f42">输入清单、回复及证据引用；可撤回或清理</text></g><g class="node" data-name="Temporal 历史 / Trace"><rect x="1061" y="887" width="480" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1075" y="917" font-size="21" font-weight="680" fill="#214f76">Temporal 历史 / Trace</text><text x="1075" y="943" font-size="16" fill="#172f42">调度历史与业务账本分开；trace 按授权裁剪</text></g><text x="44" y="1014" font-size="18" font-weight="530" fill="#172f42">现有 ExecuteStep 与回执核对继续可用。新路径以发布修订选择，旧 Workflow 历史保持原调度。</text><text x="44" y="1052" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1052" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>