<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1135" viewBox="0 0 1600 1135" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-stream · 会话网关 · 命令、增量事件与断线重连</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1135" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">会话网关 · 命令、增量事件与断线重连</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">网页成员、企业 IM 和签名 Open API 使用不同的身份边界。受理号、可展示事件、最终业务结果和渠道投递状态独立记录。</text><rect x="32" y="128" width="480" height="305" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="154" font-size="19" font-weight="680" fill="#36596a">客户端 / 渠道适配</text><rect x="559" y="128" width="480" height="305" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="573" y="154" font-size="19" font-weight="680" fill="#36596a">Go API / 入站鉴权与投影</text><rect x="1085" y="128" width="480" height="305" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1099" y="154" font-size="19" font-weight="680" fill="#36596a">事实与持久日志</text><g class="node" data-name="桌面网页"><rect x="48" y="176" width="449" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="206" font-size="21" font-weight="680" fill="#214f76">桌面网页</text><text x="62" y="232" font-size="16" fill="#172f42">成员 Cookie；发送、取消；订阅对话事件</text></g><g class="node" data-name="命令 / 成员 SSE"><rect x="575" y="176" width="449" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="589" y="206" font-size="21" font-weight="680" fill="#214f76">命令 / 成员 SSE</text><text x="589" y="232" font-size="16" fill="#172f42">检查项目成员，按会话游标重读</text></g><g class="node" data-name="conversation_events"><rect x="1101" y="176" width="449" height="69" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1115" y="206" font-size="21" font-weight="680" fill="#784b16">conversation_events</text><text x="1115" y="232" font-size="16" fill="#172f42">拟增按会话排序的日志和最终快照</text></g><g class="node" data-name="飞书 / 拟接入 Slack、钉钉"><rect x="48" y="258" width="449" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="288" font-size="21" font-weight="680" fill="#214f76">飞书 / 拟接入 Slack、钉钉</text><text x="62" y="314" font-size="16" fill="#172f42">租户、发送人、线程及外部消息 ID</text></g><g class="node" data-name="验签、去重、成员映射"><rect x="575" y="258" width="449" height="69" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="589" y="288" font-size="21" font-weight="680" fill="#214f76">验签、去重、成员映射</text><text x="589" y="314" font-size="16" fill="#172f42">卡片决定按控制版本提交；通知独立重投</text></g><g class="node" data-name="项目与渠道记录"><rect x="1101" y="258" width="449" height="69" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1115" y="288" font-size="21" font-weight="680" fill="#174f45">项目与渠道记录</text><text x="1115" y="314" font-size="16" fill="#172f42">同一委托、投递尝试、送达状态</text></g><g class="node" data-name="签名 Open API 客户端"><rect x="48" y="340" width="449" height="69" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="370" font-size="21" font-weight="680" fill="#174f45">签名 Open API 客户端</text><text x="62" y="396" font-size="16" fill="#172f42">应用身份和成员委托</text></g><g class="node" data-name="GET /api/v1/runs/{id}/events"><rect x="575" y="340" width="449" height="69" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="589" y="370" font-size="21" font-weight="680" fill="#174f45">GET /api/v1/runs/{id}/events</text><text x="589" y="396" font-size="16" fill="#172f42">Last-Event-ID 或 after，每批重新鉴权</text></g><g class="node" data-name="service_events"><rect x="1101" y="340" width="449" height="69" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1115" y="370" font-size="21" font-weight="680" fill="#174f45">service_events</text><text x="1115" y="396" font-size="16" fill="#172f42">已有运行状态事件，按 run 与 seq 查询</text></g><polyline points="497,210 575,210" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1024,210 1101,210" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="497,292 575,292" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1024,292 1101,292" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="497,374 575,374" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1024,374 1101,374" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="44" y="482" font-size="23" font-weight="670" fill="#172f42">网页对话 SSE  /  拟议线路</text><g class="node" data-name="Web / EventSource"><rect x="44" y="513" width="278" height="53" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="58" y="543" font-size="21" font-weight="680" fill="#214f76">Web / EventSource</text></g><polyline points="183,566 183,1033" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><g class="node" data-name="Go API / 会话服务"><rect x="456" y="513" width="278" height="53" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="470" y="543" font-size="21" font-weight="680" fill="#214f76">Go API / 会话服务</text></g><polyline points="595,566 595,1033" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><g class="node" data-name="PostgreSQL / 会话日志"><rect x="858" y="513" width="278" height="53" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="872" y="543" font-size="21" font-weight="680" fill="#214f76">PostgreSQL / 会话日志</text></g><polyline points="997,566 997,1033" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><g class="node" data-name="Worker / 模型适配器"><rect x="1277" y="513" width="278" height="53" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1291" y="543" font-size="21" font-weight="680" fill="#214f76">Worker / 模型适配器</text></g><polyline points="1416,566 1416,1033" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><polyline points="183,606 595,606" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="205" y="598" font-size="15" font-weight="570" fill="#375c72">POST 消息 / client_message_id</text><polyline points="595,647 997,647" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="617" y="639" font-size="15" font-weight="570" fill="#375c72">事务保存消息、运行和 outbox</text><polyline points="595,687 183,687" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="205" y="679" font-size="15" font-weight="570" fill="#785a82">返回 message_id、run_id</text><polyline points="183,727 595,727" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="205" y="719" font-size="15" font-weight="570" fill="#375c72">GET 对话事件 / 同源 Cookie + after</text><polyline points="1416,766 997,766" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="1019" y="758" font-size="15" font-weight="570" fill="#785a82">授权文本分段 / 尝试号、偏移、seq</text><polyline points="595,805 997,805" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="617" y="797" font-size="15" font-weight="570" fill="#375c72">校验读权限，按 seq 补读</text><polyline points="595,845 183,845" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="205" y="837" font-size="15" font-weight="570" fill="#785a82">SSE message.delta / id: seq</text><polyline points="1416,885 997,885" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="1019" y="877" font-size="15" font-weight="570" fill="#785a82">最终消息 + completed 事件同事务</text><polyline points="183,925 595,925" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="205" y="917" font-size="15" font-weight="570" fill="#375c72">重连 / Last-Event-ID</text><polyline points="595,965 183,965" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="205" y="957" font-size="15" font-weight="570" fill="#785a82">补发完成；游标过期则 reset + 快照</text><text x="202" y="1024" font-size="17" font-weight="540" fill="#172f42">连接断开不取消运行；撤权则停止读取。慢消费者按持久日志追平；供应商尝试按原运行核对。</text><text x="44" y="1074" font-size="17" font-weight="500" fill="#455e70">Worker 由 Temporal 异步调度。时序只展开消息与事件的传输，完整任务投递关系见系统总图。</text><text x="44" y="1107" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1107" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>