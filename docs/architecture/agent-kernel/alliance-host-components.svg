<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-host-components · Agent 执行宿主 · 模块与依赖</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">Agent 执行宿主 · 模块与依赖</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">中心框展开单个 Agent 步骤的宿主。框内是可独立替换或测试的软件模块，两翼是接入协议和执行后端，下层是持久状态。</text><rect x="32" y="132" width="300" height="608" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="158" font-size="19" font-weight="680" fill="#36596a">接入与控制  /  Go API</text><rect x="375" y="132" width="851" height="608" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="389" y="158" font-size="19" font-weight="680" fill="#36596a">Agent 宿主  /  Go Worker · Temporal Activity</text><rect x="1268" y="132" width="300" height="608" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1282" y="158" font-size="19" font-weight="680" fill="#36596a">执行后端  /  绑定提供方</text><g class="node" data-name="网页与 IM 网关"><rect x="48" y="183" width="268" height="109" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="213" font-size="21" font-weight="680" fill="#214f76">网页与 IM 网关</text><text x="62" y="239" font-size="16" fill="#172f42">成员会话、入站验签、卡片</text><text x="62" y="262" font-size="16" fill="#172f42">网页 SSE、渠道投递</text></g><g class="node" data-name="签名服务接口"><rect x="48" y="356" width="268" height="109" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="386" font-size="21" font-weight="680" fill="#174f45">签名服务接口</text><text x="62" y="412" font-size="16" fill="#172f42">按应用、成员与委托核权</text><text x="62" y="435" font-size="16" fill="#172f42">提交任务、查询状态事件</text></g><g class="node" data-name="Agent 注册与构建"><rect x="48" y="529" width="268" height="131" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="559" font-size="21" font-weight="680" fill="#174f45">Agent 注册与构建</text><text x="62" y="585" font-size="16" fill="#172f42">内置 / 成员组合 / 外部导入</text><text x="62" y="608" font-size="16" fill="#172f42">固定指令、资源与验收修订</text><text x="62" y="631" font-size="16" fill="#172f42">试跑、发布、项目绑定</text></g><g class="node" data-name="步骤宿主   ExecuteStep · AdvanceTurn"><rect x="392" y="182" width="818" height="93" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="406" y="212" font-size="21" font-weight="680" fill="#214f76">步骤宿主   ExecuteStep · AdvanceTurn</text><text x="406" y="238" font-size="16" fill="#172f42">Temporal 交付当前步骤；宿主按修订恢复，向下组合上下文、推理和动作三个端口。</text></g><text x="399" y="325" font-size="20" font-weight="680" fill="#254b62">上下文与记忆</text><text x="676" y="325" font-size="20" font-weight="680" fill="#254b62">模型与决策</text><text x="953" y="325" font-size="20" font-weight="680" fill="#254b62">动作与扩展</text><g class="node" data-name="ContextBuilder"><rect x="392" y="346" width="259" height="114" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="406" y="376" font-size="21" font-weight="680" fill="#784b16">ContextBuilder</text><text x="406" y="402" font-size="16" fill="#172f42">系统约束、最近消息与观察</text><text x="406" y="425" font-size="16" fill="#172f42">来源引用与 token 预算</text></g><g class="node" data-name="记忆与 Skill 加载"><rect x="392" y="484" width="259" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="406" y="514" font-size="21" font-weight="680" fill="#214f76">记忆与 Skill 加载</text><text x="406" y="540" font-size="16" fill="#172f42">范围召回；技能先列摘要</text><text x="406" y="563" font-size="16" fill="#172f42">正文按修订读取并校验</text></g><g class="node" data-name="Provider Resolver"><rect x="669" y="346" width="259" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="683" y="376" font-size="21" font-weight="680" fill="#214f76">Provider Resolver</text><text x="683" y="402" font-size="16" fill="#172f42">模型修订、凭据、额度</text><text x="683" y="425" font-size="16" fill="#172f42">Generate / 拟扩展 Stream</text></g><g class="node" data-name="Harness.Decide"><rect x="669" y="484" width="259" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="683" y="514" font-size="21" font-weight="680" fill="#214f76">Harness.Decide</text><text x="683" y="540" font-size="16" fill="#172f42">解析允许的动作集合</text><text x="683" y="563" font-size="16" fill="#172f42">按观察和剩余预算停止</text></g><g class="node" data-name="ActionExecutor"><rect x="946" y="346" width="264" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="960" y="376" font-size="21" font-weight="680" fill="#214f76">ActionExecutor</text><text x="960" y="402" font-size="16" fill="#172f42">登记意图与操作键、预占</text><text x="960" y="425" font-size="16" fill="#172f42">超时、取消、回执核对</text></g><g class="node" data-name="能力注册与适配"><rect x="946" y="484" width="264" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="960" y="514" font-size="21" font-weight="680" fill="#214f76">能力注册与适配</text><text x="960" y="540" font-size="16" fill="#172f42">工具 schema、A2A 操作</text><text x="960" y="563" font-size="16" fill="#172f42">入参、返回及试跑证据</text></g><polyline points="608,275 608,346" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="521,460 521,484" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="885,275 885,346" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="798,460 798,484" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1165,275 1165,346" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1078,460 1078,484" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><g class="node" data-name="RunState / 版本化运行状态"><rect x="392" y="637" width="818" height="78" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="406" y="667" font-size="21" font-weight="680" fill="#214f76">RunState / 版本化运行状态</text><text x="406" y="693" font-size="16" fill="#172f42">记录运行分支、消息高水位、未决尝试、观察与消费位置；作为各子系统恢复时的共同依据。</text></g><polyline points="521,599 521,637" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="798,599 798,637" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="1078,599 1078,637" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><g class="node" data-name="模型端点"><rect x="1284" y="183" width="268" height="109" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1298" y="213" font-size="21" font-weight="680" fill="#214f76">模型端点</text><text x="1298" y="239" font-size="16" fill="#172f42">兼容模型 HTTP、视觉模型</text><text x="1298" y="262" font-size="16" fill="#172f42">流事件按展示权限投影</text></g><g class="node" data-name="工具连接器"><rect x="1284" y="356" width="268" height="109" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1298" y="386" font-size="21" font-weight="680" fill="#174f45">工具连接器</text><text x="1298" y="412" font-size="16" fill="#172f42">企业允许的受控工具</text><text x="1298" y="435" font-size="16" fill="#172f42">独立容器执行，返回产物</text></g><g class="node" data-name="第三方 Agent"><rect x="1284" y="529" width="268" height="131" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1298" y="559" font-size="21" font-weight="680" fill="#174f45">第三方 Agent</text><text x="1298" y="585" font-size="16" fill="#172f42">A2A 消息及远端任务</text><text x="1298" y="608" font-size="16" fill="#172f42">按已验证能力查询 / 取消</text><text x="1298" y="631" font-size="16" fill="#172f42">凭原 task_id 对账</text></g><polyline points="316,237 345,237 345,173 759,173 759,182" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="855" y="165" font-size="15" font-weight="570" fill="#375c72">经业务库、outbox 与 Temporal 调度</text><polyline points="316,412 345,412 345,237" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round"/><polyline points="316,593 358,593 358,472 932,472 932,546 946,546" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="928,374 935,374 935,302 1239,302 1239,237 1284,237" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1210,410 1284,410" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1210,543 1247,543 1247,591 1284,591" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><rect x="32" y="784" width="1536" height="221" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="810" font-size="19" font-weight="680" fill="#36596a">持久状态与基础设施  /  同一企业实例</text><g class="node" data-name="PostgreSQL / 业务事实"><rect x="48" y="847" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="877" font-size="21" font-weight="680" fill="#214f76">PostgreSQL / 业务事实</text><text x="62" y="903" font-size="16" fill="#172f42">成员授权、消息、发布修订、调用账本</text><text x="62" y="926" font-size="16" fill="#172f42">拟增逐回合检查点与对话事件</text></g><g class="node" data-name="对象卷 + pgvector"><rect x="433" y="847" width="348" height="116" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="447" y="877" font-size="21" font-weight="680" fill="#174f45">对象卷 + pgvector</text><text x="447" y="903" font-size="16" fill="#172f42">原件按哈希保存；片段与向量在 PG</text><text x="447" y="926" font-size="16" fill="#172f42">索引按来源版本和编码器重建</text></g><g class="node" data-name="Temporal 持久历史"><rect x="818" y="847" width="348" height="116" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="832" y="877" font-size="21" font-weight="680" fill="#174f45">Temporal 持久历史</text><text x="832" y="903" font-size="16" fill="#172f42">工作流、任务队列、信号与计时器</text><text x="832" y="926" font-size="16" fill="#172f42">原业务动作的效果由调用账本核对</text></g><g class="node" data-name="运行观测"><rect x="1203" y="847" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1217" y="877" font-size="21" font-weight="680" fill="#214f76">运行观测</text><text x="1217" y="903" font-size="16" fill="#172f42">当前 trace / 用量；拟关联 turn_id</text><text x="1217" y="926" font-size="16" fill="#172f42">观测按范围脱敏、业务事实独立保存</text></g><polyline points="560,715 560,759 346,759 346,847" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="674,715 674,847" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="975,847 975,757 1179,757 1179,715" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="1101,715 1101,772 1370,772 1370,847" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="46" y="1030" font-size="17" font-weight="570" fill="#172f42">外层工作流负责持久等待；权限、预算、凭据与副作用由 Runtime 控制。每个模块内已有部分与拟增接口见对应详图。</text><text x="44" y="1072" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1072" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>