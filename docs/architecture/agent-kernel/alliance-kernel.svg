<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-kernel · Worker 内核 · 一个可恢复的 Agent 回合</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1190" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">Worker 内核 · 一个可恢复的 Agent 回合</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">外层 Temporal 持有计划依赖和等待；Activity 装配本轮输入、调用模型、解释决策。模型用量和每次工具效果分别记账。</text><rect x="30" y="128" width="354" height="888" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="44" y="154" font-size="19" font-weight="680" fill="#36596a">输入与上下文  /  按范围读取</text><rect x="424" y="128" width="722" height="888" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="438" y="154" font-size="19" font-weight="680" fill="#36596a">Go Worker  /  有界回合 Activity</text><rect x="1186" y="128" width="385" height="888" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1200" y="154" font-size="19" font-weight="680" fill="#36596a">受控执行与恢复  /  Runtime</text><g class="node" data-name="短期会话与检查点"><rect x="47" y="184" width="320" height="108" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="61" y="214" font-size="21" font-weight="680" fill="#214f76">短期会话与检查点</text><text x="61" y="240" font-size="16" fill="#172f42">消息高水位、摘要修订、未闭合调用</text><text x="61" y="263" font-size="16" fill="#172f42">分支游标和已消费 observation</text></g><g class="node" data-name="长期记忆与知识"><rect x="47" y="327" width="320" height="108" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="61" y="357" font-size="21" font-weight="680" fill="#214f76">长期记忆与知识</text><text x="61" y="383" font-size="16" fill="#172f42">有效偏好、团队规则、资料版本</text><text x="61" y="406" font-size="16" fill="#172f42">检索返回片段和可核对的出处</text></g><g class="node" data-name="Skill 与工具目录"><rect x="47" y="470" width="320" height="108" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="61" y="500" font-size="21" font-weight="680" fill="#214f76">Skill 与工具目录</text><text x="61" y="526" font-size="16" fill="#172f42">先列可用摘要，按需加载正文</text><text x="61" y="549" font-size="16" fill="#172f42">输入 schema、修订、权限范围</text></g><g class="node" data-name="ContextBuilder.Build"><rect x="47" y="674" width="320" height="139" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="61" y="704" font-size="21" font-weight="680" fill="#784b16">ContextBuilder.Build</text><text x="61" y="730" font-size="16" fill="#172f42">保留系统约束及未闭合调用对</text><text x="61" y="753" font-size="16" fill="#172f42">按 token 预算选近期消息和证据</text><text x="61" y="776" font-size="16" fill="#172f42">输出消息、工具 schema 和版本引用</text></g><polyline points="208,292 208,310 37,310 37,641 208,641 208,674" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="47,385 37,385" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><polyline points="47,528 37,528" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round"/><g class="node" data-name="AdvanceTurn / 可恢复的回合入口"><rect x="445" y="184" width="680" height="102" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="459" y="214" font-size="21" font-weight="680" fill="#214f76">AdvanceTurn / 可恢复的回合入口</text><text x="459" y="240" font-size="16" fill="#172f42">恢复 run、branch、turn 和控制修订；先检查取消、步数、预算与时间</text><text x="459" y="263" font-size="16" fill="#172f42">报表选择已独立；通用回合 Activity 拟增</text></g><g class="node" data-name="提示组装与窗口控制"><rect x="445" y="345" width="313" height="110" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="459" y="375" font-size="21" font-weight="680" fill="#784b16">提示组装与窗口控制</text><text x="459" y="401" font-size="16" fill="#172f42">合并固定前缀、动态观察与技能</text><text x="459" y="424" font-size="16" fill="#172f42">压缩溢出历史，保留来源游标</text></g><g class="node" data-name="模型调用 / Generate"><rect x="811" y="345" width="314" height="110" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="825" y="375" font-size="21" font-weight="680" fill="#214f76">模型调用 / Generate</text><text x="825" y="401" font-size="16" fill="#172f42">模型修订和用量预占；完整回复已有</text><text x="825" y="424" font-size="16" fill="#172f42">流式分段与结束原因拟扩展</text></g><g class="node" data-name="Harness.Decide / 结构化动作"><rect x="445" y="528" width="680" height="110" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="459" y="558" font-size="21" font-weight="680" fill="#214f76">Harness.Decide / 结构化动作</text><text x="459" y="584" font-size="16" fill="#172f42">核对工具 schema、允许集合、call_id、剩余额度与证据覆盖</text><text x="459" y="607" font-size="16" fill="#172f42">生成 CallTool / Delegate / AskUser / Finish / Stop</text></g><g class="node" data-name="Observation 配对"><rect x="445" y="715" width="317" height="117" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="459" y="745" font-size="21" font-weight="680" fill="#214f76">Observation 配对</text><text x="459" y="771" font-size="16" fill="#172f42">按 action_key、attempt、call_id</text><text x="459" y="794" font-size="16" fill="#172f42">核对回执；记录输入输出引用</text></g><g class="node" data-name="停止与等待"><rect x="806" y="715" width="319" height="117" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="820" y="745" font-size="21" font-weight="680" fill="#784b16">停止与等待</text><text x="820" y="771" font-size="16" fill="#172f42">补件转等待；终止给出原因</text><text x="820" y="794" font-size="16" fill="#172f42">Finish 提交候选及未覆盖项</text></g><g class="node" data-name="RunState.CommitTurn"><rect x="445" y="900" width="680" height="92" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="459" y="930" font-size="21" font-weight="680" fill="#784b16">RunState.CommitTurn</text><text x="459" y="956" font-size="16" fill="#172f42">按基准修订写检查点，消费一次观察；冲突方重读当前分支</text></g><g class="node" data-name="模型适配器 / 供应方"><rect x="1203" y="184" width="350" height="108" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="214" font-size="21" font-weight="680" fill="#174f45">模型适配器 / 供应方</text><text x="1217" y="240" font-size="16" fill="#172f42">凭据只在适配器内解析</text><text x="1217" y="263" font-size="16" fill="#172f42">记录 request ID、用量和尝试号</text></g><g class="node" data-name="操作核权与调用意图"><rect x="1203" y="382" width="350" height="108" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="412" font-size="21" font-weight="680" fill="#174f45">操作核权与调用意图</text><text x="1217" y="438" font-size="16" fill="#172f42">再次校验成员、能力修订及预算</text><text x="1217" y="461" font-size="16" fill="#172f42">记稳定操作键，事务提交后才派发</text></g><g class="node" data-name="工具 / 远端 Agent"><rect x="1203" y="548" width="350" height="108" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="578" font-size="21" font-weight="680" fill="#174f45">工具 / 远端 Agent</text><text x="1217" y="604" font-size="16" fill="#172f42">工具结果带调用标识；异步 A2A</text><text x="1217" y="627" font-size="16" fill="#172f42">保留远端 task_id 与 context_id</text></g><g class="node" data-name="FollowRemote / 回执核对"><rect x="1203" y="715" width="350" height="117" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="745" font-size="21" font-weight="680" fill="#174f45">FollowRemote / 回执核对</text><text x="1217" y="771" font-size="16" fill="#172f42">已受理查原任务；未知且不可查</text><text x="1217" y="794" font-size="16" fill="#172f42">进入待核对，保留经办人与恢复条件</text></g><g class="node" data-name="Temporal / 人工信号"><rect x="1203" y="900" width="350" height="92" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="930" font-size="21" font-weight="680" fill="#174f45">Temporal / 人工信号</text><text x="1217" y="956" font-size="16" fill="#172f42">补件、取消、超时唤醒后重查权限</text></g><polyline points="605,286 605,345" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="617" y="322" font-size="15" font-weight="570" fill="#375c72">开始本轮</text><polyline points="367,740 405,740 405,405 445,405" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="392" y="663" font-size="15" font-weight="570" fill="#146859">输入投影</text><polyline points="758,401 811,401" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1095,345 1095,315 1170,315 1170,241 1203,241" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="1102" y="308" font-size="15" font-weight="570" fill="#375c72">推理请求</text><polyline points="1203,266 1180,266 1180,426 1125,426" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="967,455 967,528" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="765" y="502" font-size="15" font-weight="570" fill="#785a82">模型回复 / 工具调用候选</text><polyline points="1125,581 1160,581 1160,439 1203,439" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="1165" y="427" font-size="15" font-weight="570" fill="#375c72">动作</text><polyline points="1378,490 1378,548" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="1392" y="529" font-size="15" font-weight="570" fill="#375c72">派发</text><polyline points="1378,656 1378,715" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="1391" y="698" font-size="15" font-weight="570" fill="#785a82">完成或挂起</text><polyline points="1203,780 1158,780 1158,676 602,676 602,715" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="692" y="669" font-size="15" font-weight="570" fill="#785a82">观察 / 原始尝试引用</text><polyline points="967,638 967,715" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="980" y="696" font-size="15" font-weight="570" fill="#375c72">补件 / 结束</text><polyline points="606,832 606,900" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="618" y="873" font-size="15" font-weight="570" fill="#146859">已配对</text><polyline points="968,832 968,900" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="980" y="874" font-size="15" font-weight="570" fill="#146859">保存退出点</text><polyline points="1125,945 1203,945" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="445,950 430,950 430,235 445,235" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="444" y="883" font-size="14" font-weight="540" fill="#785a82">下一轮读取已提交的观察</text><text x="45" y="1061" font-size="20" font-weight="600" fill="#172f42">恢复时先读账本：结果已落账 → 注回原回合；远端已受理 → 跟进原任务；状态未知且不可查 → 人工核对。</text><text x="45" y="1103" font-size="18" font-weight="450" fill="#455e70">只有新观察、新输入版本或新的授权决定才允许继续推进。达到轮数或成本上限后，保存已完成范围及仍缺的证据。</text><text x="44" y="1162" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1162" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>