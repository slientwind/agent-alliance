<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-memory · 记忆管理模块 · 归属、召回、失效与清除</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1150" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">记忆管理模块 · 归属、召回、失效与清除</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">短期状态保存当前任务进展；个人偏好与团队规则按各自权限和生命周期管理。知识模块持有原件，记忆只保存获准引用。</text><rect x="32" y="126" width="1536" height="170" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="152" font-size="19" font-weight="680" fill="#36596a">写入与读取端口</text><g class="node" data-name="上下文 / Runtime"><rect x="49" y="168" width="485" height="104" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="63" y="198" font-size="21" font-weight="680" fill="#214f76">上下文 / Runtime</text><text x="63" y="224" font-size="16" fill="#172f42">追加已观察的消息与调用结果</text><text x="63" y="247" font-size="16" fill="#172f42">回合号、修订、幂等观察键</text></g><g class="node" data-name="成员 / 规则维护人"><rect x="558" y="168" width="485" height="104" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="572" y="198" font-size="21" font-weight="680" fill="#174f45">成员 / 规则维护人</text><text x="572" y="224" font-size="16" fill="#172f42">明确保存、更正、撤回、续期或发布</text><text x="572" y="247" font-size="16" fill="#172f42">写入主体及用途随请求记录</text></g><g class="node" data-name="ContextBuilder / 审计"><rect x="1067" y="168" width="485" height="104" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1081" y="198" font-size="21" font-weight="680" fill="#784b16">ContextBuilder / 审计</text><text x="1081" y="224" font-size="16" fill="#172f42">请求 Recall(scope, purpose, budget)</text><text x="1081" y="247" font-size="16" fill="#172f42">返回带修订与出处的条目</text></g><rect x="32" y="345" width="462" height="403" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="371" font-size="19" font-weight="680" fill="#36596a">工作记忆  /  分支内可恢复</text><rect x="569" y="345" width="462" height="403" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="583" y="371" font-size="19" font-weight="680" fill="#36596a">持久记忆  /  成员与团队</text><rect x="1106" y="345" width="462" height="403" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1120" y="371" font-size="19" font-weight="680" fill="#36596a">可见性与回收  /  跨两类记忆</text><g class="node" data-name="消息游标与观察配对"><rect x="48" y="396" width="430" height="91" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="426" font-size="21" font-weight="680" fill="#214f76">消息游标与观察配对</text><text x="62" y="452" font-size="16" fill="#172f42">项目消息绑定 run / branch / turn</text><text x="62" y="475" font-size="16" fill="#172f42">tool_call_id 与 observation 一次消费</text></g><g class="node" data-name="窗口与摘要"><rect x="48" y="511" width="430" height="91" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="62" y="541" font-size="21" font-weight="680" fill="#784b16">窗口与摘要</text><text x="62" y="567" font-size="16" fill="#172f42">保留未闭合动作、待办、版本引用</text><text x="62" y="590" font-size="16" fill="#172f42">摘要记覆盖区间，溢出可授权回查</text></g><g class="node" data-name="检查点与依赖集"><rect x="48" y="626" width="430" height="91" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="62" y="656" font-size="21" font-weight="680" fill="#784b16">检查点与依赖集</text><text x="62" y="682" font-size="16" fill="#172f42">乐观版本比较；记录哪些记忆参与本轮</text><text x="62" y="705" font-size="16" fill="#172f42">源已失效则重算，必要依据失效则等待</text></g><polyline points="243,487 243,511" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="243,602 243,626" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><g class="node" data-name="写入分流与来源"><rect x="585" y="396" width="430" height="91" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="599" y="426" font-size="21" font-weight="680" fill="#214f76">写入分流与来源</text><text x="599" y="452" font-size="16" fill="#172f42">显式个人偏好、团队规则分开处理</text><text x="599" y="475" font-size="16" fill="#172f42">推断仅作本轮建议，保存需明确授权</text></g><g class="node" data-name="版本、冲突与发布"><rect x="585" y="511" width="430" height="91" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="599" y="541" font-size="21" font-weight="680" fill="#214f76">版本、冲突与发布</text><text x="599" y="567" font-size="16" fill="#172f42">同一偏好更正追加修订；团队由有权者发布</text><text x="599" y="590" font-size="16" fill="#172f42">冲突不静默拼接，必要规则优先</text></g><g class="node" data-name="有范围的召回"><rect x="585" y="626" width="430" height="91" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="599" y="656" font-size="21" font-weight="680" fill="#784b16">有范围的召回</text><text x="599" y="682" font-size="16" fill="#172f42">成员、角色、用途、项目、期限先筛</text><text x="599" y="705" font-size="16" fill="#172f42">再选相关条目并返回正文或可见原因</text></g><polyline points="780,487 780,511" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="780,602 780,626" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><g class="node" data-name="读取与复权"><rect x="1122" y="396" width="430" height="91" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1136" y="426" font-size="21" font-weight="680" fill="#214f76">读取与复权</text><text x="1136" y="452" font-size="16" fill="#172f42">独立应用身份不继承个人偏好</text><text x="1136" y="475" font-size="16" fill="#172f42">委托用途与读权限在恢复和读取时核验</text></g><g class="node" data-name="撤回与失效传播"><rect x="1122" y="511" width="430" height="91" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1136" y="541" font-size="21" font-weight="680" fill="#784b16">撤回与失效传播</text><text x="1136" y="567" font-size="16" fill="#172f42">生效事务写墓碑与失效事件</text><text x="1136" y="590" font-size="16" fill="#172f42">摘要、检查点、缓存按反向引用重算</text></g><g class="node" data-name="清除与恢复"><rect x="1122" y="626" width="430" height="91" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1136" y="656" font-size="21" font-weight="680" fill="#214f76">清除与恢复</text><text x="1136" y="682" font-size="16" fill="#172f42">按现有期限回收，清理正文及派生副本</text><text x="1136" y="705" font-size="16" fill="#172f42">备份恢复先补撤权和墓碑，再开放读取</text></g><polyline points="1317,487 1317,511" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1317,602 1317,626" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="285,272 285,316 245,316 245,396" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="800,272 800,316 782,316 782,396" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1308,272 1308,316 1318,316 1318,396" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1122,552 1070,552 1070,764 515,764 515,675 478,675" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="1015,667 1059,667 1059,446 1122,446" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><rect x="32" y="805" width="1536" height="179" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="831" font-size="19" font-weight="680" fill="#36596a">数据所有者与重建来源</text><g class="node" data-name="会话 / PostgreSQL"><rect x="48" y="850" width="348" height="110" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="880" font-size="21" font-weight="680" fill="#214f76">会话 / PostgreSQL</text><text x="62" y="906" font-size="16" fill="#172f42">messages、invocations 已有</text><text x="62" y="929" font-size="16" fill="#172f42">分支检查点和摘要投影拟增</text></g><g class="node" data-name="长期条目 / PostgreSQL"><rect x="433" y="850" width="348" height="110" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="447" y="880" font-size="21" font-weight="680" fill="#174f45">长期条目 / PostgreSQL</text><text x="447" y="906" font-size="16" fill="#172f42">preferences、team_rules、规则修订</text><text x="447" y="929" font-size="16" fill="#172f42">复查、过期、离职与清除状态</text></g><g class="node" data-name="拟增反向依赖索引"><rect x="818" y="850" width="348" height="110" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="832" y="880" font-size="21" font-weight="680" fill="#784b16">拟增反向依赖索引</text><text x="832" y="906" font-size="16" fill="#172f42">memory_revision → summary / turn</text><text x="832" y="929" font-size="16" fill="#172f42">按条目失效，清理作业可幂等重放</text></g><g class="node" data-name="知识模块 / 只读引用"><rect x="1203" y="850" width="348" height="110" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="880" font-size="21" font-weight="680" fill="#174f45">知识模块 / 只读引用</text><text x="1217" y="906" font-size="16" fill="#172f42">source_id、版本、片段位置</text><text x="1217" y="929" font-size="16" fill="#172f42">原件在对象卷；召回时重验范围</text></g><text x="45" y="1033" font-size="18" font-weight="550" fill="#172f42">例：采购员更正金额显示偏好。新会话召回新修订；引用旧偏好的摘要先重算；已审核报价单沿用自身版本与访问期限。</text><text x="45" y="1073" font-size="17" font-weight="520" fill="#455e70">已确认默认值：个人 90 天复查、365 天有效；到期或离职后按 30 天回收规则处理。读取端判断有效性，清理任务稍后回收正文。</text><text x="44" y="1122" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1122" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>