7" stroke="#8caec0" stroke-width="1.5"/><text x="536" y="274" font-size="14" font-weight="650" fill="#1c526e">核心组件</text><text x="536" y="302" font-size="21" font-weight="680" fill="#122d3e">嵌入式 Agent 运行器</text><text x="536" y="328" font-size="16" font-weight="420" fill="#435e70">会话写入声明、工具与回复事件</text></a><text x="40" y="465" font-size="26" font-weight="710" fill="#122d3e">Hermes Agent</text><text x="264" y="465" font-size="17" font-weight="480" fill="#435e70">多入口共享 AIAgent，历史、用户画像与技能采用不同存取接口</text><polyline points="521,552 459,552 459,528 368,528" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="520" font-size="13" font-weight="620" fill="#1c526e">服务入口</text><polyline points="521,600 459,600 459,623 368,623" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="615" font-size="13" font-weight="620" fill="#1c526e">存取</text><polyline points="841,552 900,552 900,528 992,528" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="520" font-size="13" font-weight="620" fill="#1c526e">调用</text><polyline points="841,600 900,600 900,623 992,623" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="615" font-size="13" font-weight="620" fill="#1c526e">工具调用</text><a href="https://github.com/NousResearch/hermes-agent/blob/2de9f51b8008a7d49a49221c184f2f11cbfc4af1/gateway/run.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="485" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="516" font-size="21" font-weight="680" fill="#122d3e">Gateway</text><text x="55" y="542" font-size="16" font-weight="420" fill="#435e70">把消息交给会话内的 Agent</text></a><a href="https://github.com/NousResearch/hermes-agent/blob/2de9f51b8008a7d49a49221c184f2f11cbfc4af1/hermes_state.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="580" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="611" font-size="21" font-weight="680" fill="#122d3e">SessionDB / SQLite</text><text x="55" y="637" font-size="16" font-weight="420" fill="#435e70">会话及消息持久化</text></a><a href="https://github.com/NousResearch/hermes-agent/blob/2de9f51b8008a7d49a49221c184f2f11cbfc4af1/agent/context_compressor.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="485" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="516" font-size="21" font-weight="680" fill="#122d3e">Prompt / 压缩器</text><text x="1010" y="542" font-size="16" font-weight="420" fill="#435e70">按上下文预算压缩历史</text></a><a href="https://github.com/NousResearch/hermes-agent/blob/2de9f51b8008a7d49a49221c184f2f11cbfc4af1/tools/skills_tool.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="580" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="611" font-size="21" font-weight="680" fill="#122d3e">Memory 与 Skills 工具</text><text x="1010" y="637" font-size="16" font-weight="420" fill="#435e70">记忆可编辑；技能列摘要、读全文</text></a><a href="https://github.com/NousResearch/hermes-agent/blob/2de9f51b8008a7d49a49221c184f2f11cbfc4af1/run_agent.py" target="_blank"><title>打开对应的一手来源</title><rect x="521" y="527" width="320" height="108" rx="9" fill="#eaf2f7" stroke="#8caec0" stroke-width="1.5"/><text x="536" y="550" font-size="14" font-weight="650" fill="#1c526e">核心组件</text><text x="536" y="578" font-size="21" font-weight="680" fill="#122d3e">AIAgent</text><text x="536" y="604" font-size="16" font-weight="420" fill="#435e70">模型调用、工具分派、下一回合</text></a><text x="40" y="715" font-size="16" font-weight="450" fill="#435e70">来源为上轮调研固定修订。图仅展开本次核实的组件，未画出的能力不代表项目不支持。</text></svg>