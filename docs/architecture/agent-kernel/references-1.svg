<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 742" width="1360" height="742" role="img" aria-labelledby="title desc" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title id="title">OpenClaw 与 Hermes Agent 的内核组件</title><desc id="desc">每个框可点开固定版本的原始文件。连线描述依赖或共享边界，具体关系标在连线上。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#577b8a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 Z" fill="#577b8a"/></marker></defs><rect width="1360" height="742" fill="#f5f7f8"/><text x="38" y="42" font-size="16" font-weight="700" fill="#176553">AGENT ALLIANCE   /   ENGINEERING REVIEW</text><text x="38" y="92" font-size="37" font-weight="700" fill="#122d3e">OpenClaw 与 Hermes Agent 的内核组件</text><text x="40" y="128" font-size="19" font-weight="460" fill="#435e70">每个框可点开固定版本的原始文件。连线描述依赖或共享边界，具体关系标在连线上。</text><text x="40" y="189" font-size="26" font-weight="710" fill="#122d3e">OpenClaw</text><text x="264" y="189" font-size="17" font-weight="480" fill="#435e70">以 Gateway 为中心，按会话归属串行写入</text><polyline points="521,276 459,276 459,252 368,252" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="244" font-size="13" font-weight="620" fill="#1c526e">经网关接入</text><polyline points="521,324 459,324 459,347 368,347" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="339" font-size="13" font-weight="620" fill="#1c526e">读写</text><polyline points="841,276 900,276 900,252 992,252" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="244" font-size="13" font-weight="620" fill="#1c526e">装配</text><polyline points="841,324 900,324 900,347 992,347" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="339" font-size="13" font-weight="620" fill="#1c526e">读上下文</text