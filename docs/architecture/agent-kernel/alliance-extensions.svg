<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 685" width="1360" height="685" role="img" aria-labelledby="title desc" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title id="title">Skill 加载、Agent 构建与第三方接入</title><desc id="desc">发布端固定来源、内容与版本；执行端按当前项目授权解析。Skill 清单中的工具依赖仍要经过 Runtime 的实际派发检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#577b8a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 Z" fill="#577b8a"/></marker></defs><rect width="1360" height="685" fill="#f5f7f8"/><text x="38" y="42" font-size="16" font-weight="700" fill="#176553">AGENT ALLIANCE   /   ENGINEERING REVIEW</text><text x="38" y="92" font-size="37" font-weight="700" fill="#122d3e">Skill 加载、Agent 构建与第三方接入</text><text x="40" y="128" font-size="19" font-weight="460" fill="#435e70">发布端固定来源、内容与版本；执行端按当前项目授权解析。Skill 清单中的工具依赖仍要经过 Runtime 的实际派发检查。</text><rect x="39" y="163" width="760" height="385" rx="9" fill="#f0f4f6" stroke="#abbec7" stroke-width="1.5"/><text x="56" y="193" font-size="21" font-weight="650" fill="#1c526e">构建与发布 / Go API</text><rect x="56" y="214" width="306" height="91" rx="9" fill="#eaf4f0" stroke="#86afa0" stroke-width="1.5"/><text x="71" y="245" font-size="21" font-weight="680" fill="#122d3e">平台内置 / 成员构建</text><text x="71" y="271" font-size="16" font-weight="420" fill="#435e70">指令、输入输出、能力依赖</text><rect x="56" y="326" width="306" height="91" rx="9" fill="#eaf4f0" stroke="#86afa0" stroke-width="1.5"/><text x="71" y="357" font-size="21" font-weight="680" fill="#122d3e">第三方 Agent</text><text x="71" y="383" font-size="16" font-weight="420" fill="#435e70">发现 Agent Card、试跑与发布</text><rect x="420" y="239" width="354" height="144" rx="9" fill="#eaf2f7" stroke="#8caec0" stroke-width="1.5"/><text x="435" y="262" font-size="14" font-weight="650" fill="#1c526e">资源目录已有 · 拟扩充依赖清单</text><text x="435" y="290" font-size="21" font-weight="680" fill="#122d3e">AgentRevision</text><text x="435" y="316" font-size="16" font-weight="420" fill="#435e70">固定模型或远端操作、授权范围</text><text x="435" y="339" font-size="16" font-weight="420" fill="#435e70">成员构建可组合已发布依赖</text><polyline points="362,262 416,262" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="362,369 393,369 393,337 416,337" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="442" width="306" height="83" rx="9" fill="#fff8ec" stroke="#c6a476" stroke-width="1.5" stroke-dasharray="7 4"/><text x="71" y="473" font-size="21" font-weight="680" fill="#122d3e">Skill 包 / SKILL.md</text><text x="71" y="499" font-size="16" font-weight="420" fill="#435e70">说明、资源清单、依赖与摘要</text><rect x="420" y="436" width="354" height="91" rx="9" fill="#fff8ec" stroke="#c6a476" stroke-width="1.5" stroke-dasharray="7 4"/><text x="435" y="467" font-size="21" font-weight="680" fill="#122d3e">SkillRevision</text><text x="435" y="493" font-size="16" font-weight="420" fill="#435e70">不可变版本、内容哈希、可见范围</text><polyline points="363,479 416,479" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="593,435 593,386" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><rect x="916" y="212" width="403" height="125" rx="9" fill="#fff8ec" stroke="#c6a476" stroke-width="1.5" stroke-dasharray="7 4"/><text x="931" y="235" font-size="14" font-weight="650" fill="#855016">拟新增 · Worker / ContextBuilder</text><text x="931" y="263" font-size="21" font-weight="680" fill="#122d3e">SkillLoader</text><text x="931" y="289" font-size="16" font-weight="420" fill="#435e70">先给有权使用的摘要，再按名读取正文</text><text x="931" y="312" font-size="16" font-weight="420" fill="#435e70">仅注入本轮实际需要的指令与资源</text><polyline points="775,465 835,465 835,296 913,296" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="813" y="406" font-size="15" font-weight="600" fill="#1c526e">按版本读</text><rect x="916" y="403" width="403" height="132" rx="9" fill="#eaf2f7" stroke="#8caec0" stroke-width="1.5"/><text x="931" y="426" font-size="14" font-weight="650" fill="#1c526e">已有 resources / runtime · 拟统一入口</text><text x="931" y="454" font-size="21" font-weight="680" fill="#122d3e">AgentResolver / Runtime</text><text x="931" y="480" font-size="16" font-weight="420" fill="#435e70">固定发布修订、复核权限、保留远端编号</text><text x="931" y="503" font-size="16" font-weight="420" fill="#435e70">本地模型、工具或异步远端适配器</text><polyline points="774,262 870,262 870,442 913,442" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1110,338 1110,399" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="1121" y="376" font-size="15" font-weight="590" fill="#1c526e">声明所需工具</text><text x="43" y="609" font-size="19" font-weight="530" fill="#122d3e">Skill 是运行时可读取的指令包。Agent 是可被委托并产生回执的执行主体。两者在已发布的 Agent 修订上建立依赖。</text><text x="40" y="658" font-size="16" font-weight="450" fill="#435e70">实线绿框：已有实现　　蓝框：在已有模块上扩展　　虚线橙框：拟新增接口或存储。框名表示逻辑职责。</text></svg>