<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-turn-recovery · 回合恢复 · 提交边界与故障窗口</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="990" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">回合恢复 · 提交边界与故障窗口</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">读图示例：采购助手在当前步骤调用一次报价检索。Worker 可以在任意边界退出，恢复端只依据持久事实决定下一项工作。</text><rect x="34" y="142" width="1526" height="224" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="168" font-size="19" font-weight="680" fill="#36596a">事务与外部调用  /  拟议的逐动作路径</text><g class="node" data-name="① 固定意图"><rect x="50" y="201" width="338" height="118" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="64" y="231" font-size="21" font-weight="680" fill="#214f76">① 固定意图</text><text x="64" y="257" font-size="16" fill="#172f42">核权、预占、稳定动作键</text><text x="64" y="280" font-size="16" fill="#172f42">同事务提交意图与尝试。</text></g><g class="node" data-name="② 对外派发"><rect x="437" y="201" width="338" height="118" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="451" y="231" font-size="21" font-weight="680" fill="#214f76">② 对外派发</text><text x="451" y="257" font-size="16" fill="#172f42">事务外调用绑定提供方</text><text x="451" y="280" font-size="16" fill="#172f42">记录独立请求号或远端任务号。</text></g><g class="node" data-name="③ 保存回执"><rect x="824" y="201" width="338" height="118" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="838" y="231" font-size="21" font-weight="680" fill="#214f76">③ 保存回执</text><text x="838" y="257" font-size="16" fill="#172f42">校验尝试与归属、结算用量</text><text x="838" y="280" font-size="16" fill="#172f42">保存 observation 和受控正文引用。</text></g><g class="node" data-name="④ 推进分支"><rect x="1211" y="201" width="338" height="118" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1225" y="231" font-size="21" font-weight="680" fill="#214f76">④ 推进分支</text><text x="1225" y="257" font-size="16" fill="#172f42">比较 epoch 与基准修订</text><text x="1225" y="280" font-size="16" fill="#172f42">消费观察，更新检查点与待办。</text></g><polyline points="388,257 437,257" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="775,257 824,257" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1162,257 1211,257" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><rect x="34" y="422" width="1526" height="364" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="448" font-size="19" font-weight="680" fill="#36596a">恢复读账本  /  业务事实与恢复动作</text><text x="55" y="494" font-size="18" font-weight="650" fill="#146859">本地状态</text><text x="489" y="494" font-size="18" font-weight="650" fill="#146859">能证明什么</text><text x="1015" y="494" font-size="18" font-weight="650" fill="#146859">恢复行为</text><text x="55" y="544" font-size="16" font-weight="450" fill="#172f42">已有意图，派发状态不确定</text><text x="489" y="544" font-size="16" font-weight="450" fill="#172f42">可能已送达，租约超时也不能证明未调用</text><text x="1015" y="544" font-size="16" font-weight="450" fill="#172f42">先用同一供应商键查原任务；不能查则待核对</text><text x="55" y="594" font-size="16" font-weight="450" fill="#172f42">远端已受理 / 已有原任务号</text><text x="489" y="594" font-size="16" font-weight="450" fill="#172f42">原尝试已存在，当前调用还没有最终观察</text><text x="1015" y="594" font-size="16" font-weight="450" fill="#172f42">有限轮询或等回调，重启不创建第二个任务</text><text x="55" y="644" font-size="16" font-weight="450" fill="#172f42">回执已入账，检查点未推进</text><text x="489" y="644" font-size="16" font-weight="450" fill="#172f42">原费用、尝试与观察可查，观察仍未消费</text><text x="1015" y="644" font-size="16" font-weight="450" fill="#172f42">复权后消费原观察，完成检查点比较提交</text><text x="55" y="694" font-size="16" font-weight="450" fill="#172f42">检查点已提交，Worker 回应丢失</text><text x="489" y="694" font-size="16" font-weight="450" fill="#172f42">同一逻辑决定或观察已经消费</text><text x="1015" y="694" font-size="16" font-weight="450" fill="#172f42">按原键返回已提交状态，下一轮从新游标继续</text><text x="55" y="744" font-size="16" font-weight="450" fill="#172f42">被撤权、取消或已换尝试后迟到</text><text x="489" y="744" font-size="16" font-weight="450" fill="#172f42">已发生的费用与回执属于原尝试</text><text x="1015" y="744" font-size="16" font-weight="450" fill="#172f42">保留受限核对证据，禁止自动恢复或采纳</text><text x="43" y="854" font-size="19" font-weight="550" fill="#172f42">查询、Temporal 技术重试、业务重做各有独立计数。查询和租约只能帮助核对状态，不能证明外部动作恰好执行一次。</text><text x="43" y="902" font-size="17" font-weight="490" fill="#455e70">模型调用同样可能付费。已保存完整回复可重新解释；只有文本草稿或中断流时先核对费用与尝试，再决定能否开始新推理。</text><text x="44" y="962" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="962" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>