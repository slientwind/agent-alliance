<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-harness · Harness · 模型输入、动作解释与校验端口</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">Harness · 模型输入、动作解释与校验端口</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">Harness 接收已获准的版本化输入，把模型的完整回复解释为有限动作。签发凭据、预算预占和业务写入归 Runtime。</text><rect x="32" y="126" width="350" height="638" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="152" font-size="19" font-weight="680" fill="#36596a">模块输入  /  已裁剪投影</text><rect x="425" y="126" width="725" height="638" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="439" y="152" font-size="19" font-weight="680" fill="#36596a">Go 包 internal/harness  /  固定策略与纯转换</text><rect x="1194" y="126" width="367" height="638" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1208" y="152" font-size="19" font-weight="680" fill="#36596a">模块输出  /  有权执行方</text><g class="node" data-name="构建工件"><rect x="49" y="188" width="317" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="63" y="218" font-size="21" font-weight="680" fill="#214f76">构建工件</text><text x="63" y="244" font-size="16" fill="#172f42">Agent 修订、策略版本、I/O 契约</text><text x="63" y="267" font-size="16" fill="#172f42">允许的操作、固定 Skill 和子 Agent</text></g><g class="node" data-name="上下文快照"><rect x="49" y="375" width="317" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="63" y="405" font-size="21" font-weight="680" fill="#214f76">上下文快照</text><text x="63" y="431" font-size="16" fill="#172f42">目标、有效偏好、近期消息与摘要</text><text x="63" y="454" font-size="16" fill="#172f42">工具结果配对、资料修订与引文</text></g><g class="node" data-name="运行限制"><rect x="49" y="567" width="317" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="63" y="597" font-size="21" font-weight="680" fill="#214f76">运行限制</text><text x="63" y="623" font-size="16" fill="#172f42">窗口、剩余额度、截止时间、范围</text><text x="63" y="646" font-size="16" fill="#172f42">待处理调用、已确认目标与缺项</text></g><g class="node" data-name="输入装配 / Build"><rect x="444" y="188" width="326" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="458" y="218" font-size="21" font-weight="680" fill="#214f76">输入装配 / Build</text><text x="458" y="244" font-size="16" fill="#172f42">划分规则、数据、观察与工具说明</text><text x="458" y="267" font-size="16" fill="#172f42">预算裁剪；返回输入版本与依赖集</text></g><g class="node" data-name="模型请求 / ModelInput"><rect x="804" y="188" width="327" height="115" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="818" y="218" font-size="21" font-weight="680" fill="#784b16">模型请求 / ModelInput</text><text x="818" y="244" font-size="16" fill="#172f42">有序消息、工具 schema、输出约束</text><text x="818" y="267" font-size="16" fill="#172f42">完整输出上限与可见字段</text></g><g class="node" data-name="回复解码 / Decode"><rect x="444" y="375" width="326" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="458" y="405" font-size="21" font-weight="680" fill="#214f76">回复解码 / Decode</text><text x="458" y="431" font-size="16" fill="#172f42">校验结束原因与完整参数</text><text x="458" y="454" font-size="16" fill="#172f42">原生 tool call 或固定类型回复</text></g><g class="node" data-name="动作与参数 / Validate"><rect x="804" y="375" width="327" height="115" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="818" y="405" font-size="21" font-weight="680" fill="#784b16">动作与参数 / Validate</text><text x="818" y="431" font-size="16" fill="#172f42">操作和绑定修订必须在允许集合内</text><text x="818" y="454" font-size="16" fill="#172f42">校验必填字段、类型、引用与调用号</text></g><g class="node" data-name="进展与证据 / Assess"><rect x="444" y="567" width="326" height="114" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="458" y="597" font-size="21" font-weight="680" fill="#784b16">进展与证据 / Assess</text><text x="458" y="623" font-size="16" fill="#172f42">对象覆盖、新来源、未决项、重复窗</text><text x="458" y="646" font-size="16" fill="#172f42">停滞或预算耗尽给出明确原因</text></g><g class="node" data-name="动作决定 / Decide"><rect x="804" y="567" width="327" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="818" y="597" font-size="21" font-weight="680" fill="#214f76">动作决定 / Decide</text><text x="818" y="623" font-size="16" fill="#172f42">工具、委派、补件、候选、停止</text><text x="818" y="646" font-size="16" fill="#172f42">附动作参数、依赖、缺项或停止理由</text></g><g class="node" data-name="模型适配器 / Runtime"><rect x="1212" y="188" width="330" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1226" y="218" font-size="21" font-weight="680" fill="#214f76">模型适配器 / Runtime</text><text x="1226" y="244" font-size="16" fill="#172f42">按修订核权、预占；Generate / Stream</text><text x="1226" y="267" font-size="16" fill="#172f42">只提供最终回复与用量给决策端</text></g><g class="node" data-name="网页对话投影"><rect x="1212" y="375" width="330" height="115" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="1226" y="405" font-size="21" font-weight="680" fill="#784b16">网页对话投影</text><text x="1226" y="431" font-size="16" fill="#172f42">可见文本分段与状态；断线后补读</text><text x="1226" y="454" font-size="16" fill="#172f42">未完成参数不会触发工具调用</text></g><g class="node" data-name="Runtime / 人工 / 审核"><rect x="1212" y="567" width="330" height="114" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1226" y="597" font-size="21" font-weight="680" fill="#214f76">Runtime / 人工 / 审核</text><text x="1226" y="623" font-size="16" fill="#172f42">提交决定并复权后派发或等待</text><text x="1226" y="646" font-size="16" fill="#172f42">记录回执、候选及证据；保留动作键</text></g><polyline points="366,246 444,246" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="366,432 401,432 401,268 444,268" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="366,623 391,623 391,286 444,286" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="770,245 804,245" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1131,245 1212,245" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1280,303 1280,332 602,332 602,375" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><text x="902" y="324" font-size="15" font-weight="570" fill="#785a82">完整 ModelReply</text><polyline points="1400,303 1400,375" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="770,434 804,434" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="973,490 973,531 608,531 608,567" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="770,624 804,624" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1131,624 1212,624" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><rect x="32" y="816" width="1529" height="153" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="842" font-size="19" font-weight="680" fill="#36596a">可复核的现有纵切  /  报表工具选择</text><g class="node" data-name="输入"><rect x="48" y="865" width="480" height="77" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="895" font-size="21" font-weight="680" fill="#174f45">输入</text><text x="62" y="921" font-size="16" fill="#172f42">当前目标、CSV 表头、两个候选的固定顺序</text></g><g class="node" data-name="回复"><rect x="555" y="865" width="480" height="77" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="569" y="895" font-size="21" font-weight="680" fill="#174f45">回复</text><text x="569" y="921" font-size="16" fill="#172f42">只接受候选范围内位置；越界或歧义弃权</text></g><g class="node" data-name="派发"><rect x="1060" y="865" width="480" height="77" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1074" y="895" font-size="21" font-weight="680" fill="#174f45">派发</text><text x="1074" y="921" font-size="16" fill="#172f42">选择登记在目标步骤，实际执行再次核权</text></g><text x="43" y="1025" font-size="17" font-weight="560" fill="#172f42">同一输入清单与同一已记录回复应得到相同决定。回放只运行纯转换；线上模型调用和外部效果按各自尝试单独记账。</text><text x="44" y="1072" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1072" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>