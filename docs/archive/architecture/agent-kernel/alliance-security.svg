<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-security · 安全架构 · 信任边界、判定与执行点</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1160" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">安全架构 · 信任边界、判定与执行点</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">一项授权决定绑定身份、对象与当前动作。网页会话、文档内容、模型输出和第三方任务回包进入系统时拥有不同的可信度。</text><rect x="32" y="126" width="418" height="654" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="152" font-size="19" font-weight="680" fill="#36596a">入口与输入边界</text><rect x="534" y="126" width="525" height="654" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="548" y="152" font-size="19" font-weight="680" fill="#36596a">统一策略语义  /  拟封装为本地 Go 接口</text><rect x="1142" y="126" width="426" height="654" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1156" y="152" font-size="19" font-weight="680" fill="#36596a">靠近数据或副作用的执行点</text><g class="node" data-name="网页 / IM / Open API"><rect x="48" y="188" width="385" height="119" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="218" font-size="21" font-weight="680" fill="#174f45">网页 / IM / Open API</text><text x="62" y="244" font-size="16" fill="#172f42">会话或签名、租户与成员映射</text><text x="62" y="267" font-size="16" fill="#172f42">应用自有身份与成员委托分别核对</text></g><g class="node" data-name="资料、Skill、模型、远端结果"><rect x="48" y="373" width="385" height="119" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="403" font-size="21" font-weight="680" fill="#214f76">资料、Skill、模型、远端结果</text><text x="62" y="429" font-size="16" fill="#172f42">带来源与修订的输入；校验结构与长度</text><text x="62" y="452" font-size="16" fill="#172f42">模型提出动作，执行范围来自当前委托</text></g><g class="node" data-name="控制信号与撤权"><rect x="48" y="558" width="385" height="119" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="588" font-size="21" font-weight="680" fill="#214f76">控制信号与撤权</text><text x="62" y="614" font-size="16" fill="#172f42">成员离职、授权到期、紧急停用</text><text x="62" y="637" font-size="16" fill="#172f42">识别主体、项目、能力和控制修订</text></g><g class="node" data-name="认证后的动作请求"><rect x="551" y="187" width="490" height="112" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="565" y="217" font-size="21" font-weight="680" fill="#784b16">认证后的动作请求</text><text x="565" y="243" font-size="16" fill="#172f42">subject / actor / delegation / purpose</text><text x="565" y="266" font-size="16" fill="#172f42">project / object@rev / operation / target</text></g><g class="node" data-name="策略判定与理由"><rect x="551" y="337" width="490" height="112" rx="7" fill="#fff6e8" stroke="#c39a65" stroke-width="1.6" stroke-dasharray="7 4"/><text x="565" y="367" font-size="21" font-weight="680" fill="#784b16">策略判定与理由</text><text x="565" y="393" font-size="16" fill="#172f42">交集：当前成员、项目、资料、工具和出站范围</text><text x="565" y="416" font-size="16" fill="#172f42">输出 allow / deny / need_decision 及范围、理由</text></g><g class="node" data-name="用途、预算与人工决定"><rect x="551" y="487" width="490" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="565" y="517" font-size="21" font-weight="680" fill="#214f76">用途、预算与人工决定</text><text x="565" y="543" font-size="16" fill="#172f42">写操作需检查对象与效果；预占与实际用量对齐</text><text x="565" y="566" font-size="16" fill="#172f42">要求人工确认时绑定动作摘要、修订及责任人</text></g><g class="node" data-name="复核与最小审计"><rect x="551" y="637" width="490" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="565" y="667" font-size="21" font-weight="680" fill="#214f76">复核与最小审计</text><text x="565" y="693" font-size="16" fill="#172f42">受理、派发、回执采纳、恢复、订阅读取分别复核</text><text x="565" y="716" font-size="16" fill="#172f42">记录决定 ID、尝试号及理由，正文受查看权限约束</text></g><g class="node" data-name="数据读与订阅"><rect x="1159" y="187" width="392" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1173" y="217" font-size="21" font-weight="680" fill="#214f76">数据读与订阅</text><text x="1173" y="243" font-size="16" fill="#172f42">先筛授权版本再检索；SSE 分批复权</text><text x="1173" y="266" font-size="16" fill="#172f42">对象下载、预览和导出分别核验</text></g><g class="node" data-name="凭据与出站适配"><rect x="1159" y="337" width="392" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1173" y="367" font-size="21" font-weight="680" fill="#214f76">凭据与出站适配</text><text x="1173" y="393" font-size="16" fill="#172f42">凭据引用按修订解析；限制目标与重定向</text><text x="1173" y="416" font-size="16" fill="#172f42">向外发送前裁剪允许字段与附件</text></g><g class="node" data-name="工具隔离与结果接收"><rect x="1159" y="487" width="392" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1173" y="517" font-size="21" font-weight="680" fill="#214f76">工具隔离与结果接收</text><text x="1173" y="543" font-size="16" fill="#172f42">工具、预览分容器；限制权限、资源和网络</text><text x="1173" y="566" font-size="16" fill="#172f42">验证回执归属再用于成果和下一回合</text></g><g class="node" data-name="撤权与事件响应"><rect x="1159" y="637" width="392" height="112" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1173" y="667" font-size="21" font-weight="680" fill="#214f76">撤权与事件响应</text><text x="1173" y="693" font-size="16" fill="#172f42">阻止新派发及继续推流；保留已有事实</text><text x="1173" y="716" font-size="16" fill="#172f42">失联查询原任务，迟到回执按原尝试留存</text></g><polyline points="797,299 797,337" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="797,449 797,487" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="797,599 797,637" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="433,246 551,246" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="433,431 506,431 506,397 551,397" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="433,616 492,616 492,700 551,700" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><polyline points="1041,387 1112,387 1112,242 1159,242" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="1041,406 1159,406" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1041,543 1159,543" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1041,694 1159,694" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><rect x="32" y="825" width="1536" height="209" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="851" font-size="19" font-weight="680" fill="#36596a">状态、部署与故障边界</text><g class="node" data-name="策略事实 / PostgreSQL"><rect x="48" y="880" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="910" font-size="21" font-weight="680" fill="#214f76">策略事实 / PostgreSQL</text><text x="62" y="936" font-size="16" fill="#172f42">项目与团队授权、委托、资源修订</text><text x="62" y="959" font-size="16" fill="#172f42">检查当前有效性；不可用时暂停受限动作</text></g><g class="node" data-name="凭据 / 资源适配器"><rect x="433" y="880" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="447" y="910" font-size="21" font-weight="680" fill="#214f76">凭据 / 资源适配器</text><text x="447" y="936" font-size="16" fill="#172f42">加密密文、密钥引用、轮换与撤销</text><text x="447" y="959" font-size="16" fill="#172f42">模型上下文和构建工件只见引用</text></g><g class="node" data-name="沙箱 / 实例隔离"><rect x="818" y="880" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="832" y="910" font-size="21" font-weight="680" fill="#214f76">沙箱 / 实例隔离</text><text x="832" y="936" font-size="16" fill="#172f42">工具和预览已有只读根、资源限制</text><text x="832" y="959" font-size="16" fill="#172f42">通用按运行目录及出站策略拟增强</text></g><g class="node" data-name="审计 / 事件响应"><rect x="1203" y="880" width="348" height="116" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1217" y="910" font-size="21" font-weight="680" fill="#214f76">审计 / 事件响应</text><text x="1217" y="936" font-size="16" fill="#172f42">记录必要元数据；审计与 trace 分权</text><text x="1217" y="959" font-size="16" fill="#172f42">受限操作的意图和审计需持久化</text></g><text x="44" y="1083" font-size="18" font-weight="570" fill="#172f42">重点验收：读取后撤权、缓存复用、试跑与正式凭据隔离、重复回调、迟到结果、权限存储不可用及恢复后重验。</text><text x="44" y="1132" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1132" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>