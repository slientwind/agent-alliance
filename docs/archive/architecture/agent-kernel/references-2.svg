<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 742" width="1360" height="742" role="img" aria-labelledby="title desc" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title id="title">nanobot 与 OpenManus 的内核组件</title><desc id="desc">每个框可点开固定版本的原始文件。连线描述依赖或共享边界，具体关系标在连线上。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#577b8a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 Z" fill="#577b8a"/></marker></defs><rect width="1360" height="742" fill="#f5f7f8"/><text x="38" y="42" font-size="16" font-weight="700" fill="#176553">AGENT ALLIANCE   /   ENGINEERING REVIEW</text><text x="38" y="92" font-size="37" font-weight="700" fill="#122d3e">nanobot 与 OpenManus 的内核组件</text><text x="40" y="128" font-size="19" font-weight="460" fill="#435e70">每个框可点开固定版本的原始文件。连线描述依赖或共享边界，具体关系标在连线上。</text><text x="40" y="189" font-size="26" font-weight="710" fill="#122d3e">nanobot</text><text x="264" y="189" font-size="17" font-weight="480" fill="#435e70">消息总线解耦渠道，SessionManager 与 MemoryStore 分开管理</text><polyline points="521,276 459,276 459,252 368,252" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="244" font-size="13" font-weight="620" fill="#1c526e">消费／发布</text><polyline points="521,324 459,324 459,347 368,347" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="339" font-size="13" font-weight="620" fill="#1c526e">读写</text><polyline points="841,276 900,276 900,252 992,252" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="244" font-size="13" font-weight="620" fill="#1c526e">加载</text><polyline points="841,324 900,324 900,347 992,347" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="339" font-size="13" font-weight="620" fill="#1c526e">借助归档</text><a href="https://github.com/HKUDS/nanobot/blob/db0306b404954e48ffb82ceae70cbf6f73094348/nanobot/bus/queue.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="209" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="240" font-size="21" font-weight="680" fill="#122d3e">MessageBus</text><text x="55" y="266" font-size="16" font-weight="420" fill="#435e70">入站与出站队列连接渠道</text></a><a href="https://github.com/HKUDS/nanobot/blob/db0306b404954e48ffb82ceae70cbf6f73094348/nanobot/session/manager.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="304" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="335" font-size="21" font-weight="680" fill="#122d3e">SessionManager</text><text x="55" y="361" font-size="16" font-weight="420" fill="#435e70">当前存储适配使用 SQLite</text></a><a href="https://github.com/HKUDS/nanobot/blob/db0306b404954e48ffb82ceae70cbf6f73094348/nanobot/agent/skills.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="209" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="240" font-size="21" font-weight="680" fill="#122d3e">SkillsLoader</text><text x="1010" y="266" font-size="16" font-weight="420" fill="#435e70">依赖检查、索引与按名读取</text></a><a href="https://github.com/HKUDS/nanobot/blob/db0306b404954e48ffb82ceae70cbf6f73094348/nanobot/agent/memory.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="304" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="335" font-size="21" font-weight="680" fill="#122d3e">MemoryStore / Archiver</text><text x="1010" y="361" font-size="16" font-weight="420" fill="#435e70">MEMORY.md、历史归档与游标</text></a><a href="https://github.com/HKUDS/nanobot/blob/db0306b404954e48ffb82ceae70cbf6f73094348/nanobot/agent/loop.py" target="_blank"><title>打开对应的一手来源</title><rect x="521" y="251" width="320" height="108" rx="9" fill="#eaf2f7" stroke="#8caec0" stroke-width="1.5"/><text x="536" y="274" font-size="14" font-weight="650" fill="#1c526e">核心组件</text><text x="536" y="302" font-size="21" font-weight="680" fill="#122d3e">AgentLoop</text><text x="536" y="328" font-size="16" font-weight="420" fill="#435e70">组织上下文、调模型和工具</text></a><text x="40" y="465" font-size="26" font-weight="710" fill="#122d3e">OpenManus</text><text x="264" y="465" font-size="17" font-weight="480" fill="#435e70">最小可读的 ReAct 内核，显式展示工具结果如何进入下一轮</text><polyline points="521,552 459,552 459,528 368,528" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="520" font-size="13" font-weight="620" fill="#1c526e">继承</text><polyline points="521,600 459,600 459,623 368,623" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="615" font-size="13" font-weight="620" fill="#1c526e">继承</text><polyline points="841,552 900,552 900,528 992,528" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="520" font-size="13" font-weight="620" fill="#1c526e">调用</text><polyline points="841,600 900,600 900,623 992,623" fill="none" stroke="#577b8a" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="615" font-size="13" font-weight="620" fill="#1c526e">追加消息</text><a href="https://github.com/FoundationAgents/OpenManus/blob/3309bf4e416fb1c74b008f3e86494439a31bad53/app/agent/base.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="485" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="516" font-size="21" font-weight="680" fill="#122d3e">BaseAgent</text><text x="55" y="542" font-size="16" font-weight="420" fill="#435e70">运行状态、步数上限、停滞判断</text></a><a href="https://github.com/FoundationAgents/OpenManus/blob/3309bf4e416fb1c74b008f3e86494439a31bad53/app/agent/react.py" target="_blank"><title>打开对应的一手来源</title><rect x="40" y="580" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="55" y="611" font-size="21" font-weight="680" fill="#122d3e">ReActAgent</text><text x="55" y="637" font-size="16" font-weight="420" fill="#435e70">step 调用 think / act</text></a><a href="https://github.com/FoundationAgents/OpenManus/blob/3309bf4e416fb1c74b008f3e86494439a31bad53/app/tool/tool_collection.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="485" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="516" font-size="21" font-weight="680" fill="#122d3e">ToolCollection</text><text x="1010" y="542" font-size="16" font-weight="420" fill="#435e70">按名派发并返回工具结果</text></a><a href="https://github.com/FoundationAgents/OpenManus/blob/3309bf4e416fb1c74b008f3e86494439a31bad53/app/schema.py" target="_blank"><title>打开对应的一手来源</title><rect x="995" y="580" width="325" height="81" rx="9" fill="white" stroke="#b2c4ca" stroke-width="1.5"/><text x="1010" y="611" font-size="21" font-weight="680" fill="#122d3e">Memory / Message</text><text x="1010" y="637" font-size="16" font-weight="420" fill="#435e70">通过 tool_call_id 关联工具回包</text></a><a href="https://github.com/FoundationAgents/OpenManus/blob/3309bf4e416fb1c74b008f3e86494439a31bad53/app/agent/toolcall.py" target="_blank"><title>打开对应的一手来源</title><rect x="521" y="527" width="320" height="108" rx="9" fill="#eaf2f7" stroke="#8caec0" stroke-width="1.5"/><text x="536" y="550" font-size="14" font-weight="650" fill="#1c526e">核心组件</text><text x="536" y="578" font-size="21" font-weight="680" fill="#122d3e">ToolCallAgent</text><text x="536" y="604" font-size="16" font-weight="420" fill="#435e70">think 选择工具，act 执行调用</text></a><text x="40" y="715" font-size="16" font-weight="450" fill="#435e70">来源为上轮调研固定修订。图仅展开本次核实的组件，未画出的能力不代表项目不支持。</text></svg>