<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-components · 企业 Agent 平台 · 模块所有者与运行边界</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">企业 Agent 平台 · 模块所有者与运行边界</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">每家企业独立部署。构建管理发布定义，记忆管理可用上下文，安全模块在各信任边界执行检查，Runtime 持有业务动作的执行权。</text><rect x="32" y="120" width="1536" height="203" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="146" font-size="19" font-weight="680" fill="#36596a">安全模块  /  入口、数据读取、外部派发及结果投递共用策略语义</text><g class="node" data-name="身份与授权"><rect x="48" y="172" width="348" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="202" font-size="21" font-weight="680" fill="#214f76">身份与授权</text><text x="62" y="228" font-size="16" fill="#172f42">成员、应用、委托与项目范围</text><text x="62" y="251" font-size="16" fill="#172f42">把调用主体与承担费用的团队分开</text></g><g class="node" data-name="资料与记忆访问"><rect x="433" y="172" width="348" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="447" y="202" font-size="21" font-weight="680" fill="#214f76">资料与记忆访问</text><text x="447" y="228" font-size="16" fill="#172f42">按对象、版本、用途裁剪</text><text x="447" y="251" font-size="16" fill="#172f42">撤权后重新检查回合与订阅</text></g><g class="node" data-name="调用与凭据"><rect x="818" y="172" width="348" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="832" y="202" font-size="21" font-weight="680" fill="#214f76">调用与凭据</text><text x="832" y="228" font-size="16" fill="#172f42">绑定能力修订、目标端点和预算</text><text x="832" y="251" font-size="16" fill="#172f42">工具隔离，凭据只进入受控适配器</text></g><g class="node" data-name="审计与处置"><rect x="1203" y="172" width="348" height="115" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1217" y="202" font-size="21" font-weight="680" fill="#214f76">审计与处置</text><text x="1217" y="228" font-size="16" fill="#172f42">记录决定、操作键和尝试号</text><text x="1217" y="251" font-size="16" fill="#172f42">停用主体、紧急停止与恢复核对</text></g><rect x="32" y="377" width="454" height="427" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="403" font-size="19" font-weight="680" fill="#36596a">Agent 构建模块  /  Go API + 试跑执行端</text><rect x="570" y="377" width="460" height="427" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="584" y="403" font-size="19" font-weight="680" fill="#36596a">运行模块  /  API 受理 + Go Worker</text><rect x="1114" y="377" width="454" height="427" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1128" y="403" font-size="19" font-weight="680" fill="#36596a">记忆管理模块  /  API + 后台维护</text><g class="node" data-name="定义与依赖编译"><rect x="48" y="434" width="422" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="464" font-size="21" font-weight="680" fill="#214f76">定义与依赖编译</text><text x="62" y="490" font-size="16" fill="#172f42">创建草稿、输入输出、模型、工具、Skill、子 Agent</text><text x="62" y="513" font-size="16" fill="#172f42">固定依赖图；检查可见范围和相互依赖</text></g><g class="node" data-name="评测与发布"><rect x="48" y="567" width="422" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="597" font-size="21" font-weight="680" fill="#214f76">评测与发布</text><text x="62" y="623" font-size="16" fill="#172f42">样例试跑、修订级证据、发布申请与退回</text><text x="62" y="646" font-size="16" fill="#172f42">新版本、回退目标、普通停用与紧急停止</text></g><g class="node" data-name="AgentRevision / 发布目录"><rect x="48" y="697" width="422" height="83" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="62" y="727" font-size="21" font-weight="680" fill="#214f76">AgentRevision / 发布目录</text><text x="62" y="753" font-size="16" fill="#172f42">只读发布契约；正式运行只能绑定已发布修订</text></g><g class="node" data-name="入口与调度"><rect x="586" y="434" width="428" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="600" y="464" font-size="21" font-weight="680" fill="#214f76">入口与调度</text><text x="600" y="490" font-size="16" fill="#172f42">网页、签名 API、飞书；Slack / 钉钉拟接入</text><text x="600" y="513" font-size="16" fill="#172f42">业务记录 + outbox → Temporal → Activity</text></g><g class="node" data-name="Agent Loop / Harness"><rect x="586" y="567" width="428" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="600" y="597" font-size="21" font-weight="680" fill="#214f76">Agent Loop / Harness</text><text x="600" y="623" font-size="16" fill="#172f42">Loop 控制回合、等待与恢复</text><text x="600" y="646" font-size="16" fill="#172f42">Harness 装配输入、解释动作与停止原因</text></g><g class="node" data-name="Runtime / 资源适配器"><rect x="586" y="697" width="428" height="83" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="600" y="727" font-size="21" font-weight="680" fill="#214f76">Runtime / 资源适配器</text><text x="600" y="753" font-size="16" fill="#172f42">核权、预占、派发、回执、恢复与人工接续</text></g><g class="node" data-name="短期状态与压缩"><rect x="1130" y="434" width="422" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1144" y="464" font-size="21" font-weight="680" fill="#214f76">短期状态与压缩</text><text x="1144" y="490" font-size="16" fill="#172f42">近期消息、未闭合调用、检查点、摘要游标</text><text x="1144" y="513" font-size="16" fill="#172f42">保持工具结果配对与恢复所需版本</text></g><g class="node" data-name="长期记忆与召回"><rect x="1130" y="567" width="422" height="98" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1144" y="597" font-size="21" font-weight="680" fill="#214f76">长期记忆与召回</text><text x="1144" y="623" font-size="16" fill="#172f42">个人显式偏好、团队发布规则、有效期</text><text x="1144" y="646" font-size="16" fill="#172f42">先按身份与用途筛选，再装配允许的内容</text></g><g class="node" data-name="依赖与失效"><rect x="1130" y="697" width="422" height="83" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="1144" y="727" font-size="21" font-weight="680" fill="#214f76">依赖与失效</text><text x="1144" y="753" font-size="16" fill="#172f42">引用清单、撤回与清理；旧投影按依赖重建</text></g><polyline points="262,323 262,377" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="800,323 800,377" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="1342,323 1342,377" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="259,532 259,567" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="259,665 259,697" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="800,532 800,567" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="800,665 800,697" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="470,735 523,735 523,482 586,482" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="493" y="560" font-size="15" font-weight="570" fill="#146859">绑定修订</text><polyline points="1130,615 1014,615" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="1039" y="603" font-size="15" font-weight="570" fill="#146859">召回结果</text><polyline points="1130,738 1091,738 1091,652 1014,652" fill="none" stroke="#785a82" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#e)"/><rect x="32" y="853" width="1536" height="154" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="46" y="879" font-size="19" font-weight="680" fill="#36596a">共享基础设施  /  数据归属在模块内，跨模块通过接口访问</text><g class="node" data-name="PostgreSQL"><rect x="48" y="903" width="348" height="78" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="62" y="933" font-size="21" font-weight="680" fill="#174f45">PostgreSQL</text><text x="62" y="959" font-size="16" fill="#172f42">定义、修订、记忆、授权、运行账本</text></g><g class="node" data-name="对象卷与 pgvector"><rect x="433" y="903" width="348" height="78" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="447" y="933" font-size="21" font-weight="680" fill="#174f45">对象卷与 pgvector</text><text x="447" y="959" font-size="16" fill="#172f42">资料原件、可重建的检索片段与向量</text></g><g class="node" data-name="Temporal"><rect x="818" y="903" width="348" height="78" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="832" y="933" font-size="21" font-weight="680" fill="#174f45">Temporal</text><text x="832" y="959" font-size="16" fill="#172f42">工作流历史、队列、计时器、人工信号</text></g><g class="node" data-name="工具与提供方"><rect x="1203" y="903" width="348" height="78" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1217" y="933" font-size="21" font-weight="680" fill="#174f45">工具与提供方</text><text x="1217" y="959" font-size="16" fill="#172f42">受控工具、预览容器、模型和外部 Agent</text></g><text x="43" y="1045" font-size="18" font-weight="540" fill="#172f42">各模块首先沿用现有进程部署。安全策略、构建清单和记忆失效的专用端口见三张模块详图。</text><text x="44" y="1072" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1072" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>