<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="t" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><title id="t">alliance-overview · 企业 Agent 平台 · 组件、协议与持久化边界</title><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#375c72"/></marker><marker id="e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#785a82"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#146859"/></marker></defs><rect x="0" y="0" width="1600" height="1130" rx="6" fill="#f7f9fa" stroke="none" stroke-width="1.5"/><text x="42" y="48" font-size="36" font-weight="680" fill="#172f42">企业 Agent 平台 · 组件、协议与持久化边界</text><text x="44" y="82" font-size="19" font-weight="440" fill="#455e70">单企业实例内的三类入口共享项目身份。正式运行由 Worker 接管，模型、工具和远端 Agent 经独立适配器访问。</text><g class="node" data-name="桌面 Web 对话"><rect x="44" y="115" width="470" height="84" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="58" y="145" font-size="21" font-weight="680" fill="#214f76">桌面 Web 对话</text><text x="58" y="171" font-size="16" fill="#172f42">HTTPS 命令 · 成员 Cookie · 拟接入消息 SSE</text></g><g class="node" data-name="企业 IM 连接器"><rect x="565" y="115" width="470" height="84" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="579" y="145" font-size="21" font-weight="680" fill="#214f76">企业 IM 连接器</text><text x="579" y="171" font-size="16" fill="#172f42">飞书已有；Slack / 钉钉按渠道能力接入</text></g><g class="node" data-name="企业应用 / Open API"><rect x="1086" y="115" width="470" height="84" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1100" y="145" font-size="21" font-weight="680" fill="#174f45">企业应用 / Open API</text><text x="1100" y="171" font-size="16" fill="#172f42">签名请求、委托凭证、运行状态 SSE</text></g><rect x="34" y="244" width="1532" height="170" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="270" font-size="19" font-weight="680" fill="#36596a">Go API  /  渠道、会话与项目控制</text><g class="node" data-name="会话命令与成员订阅"><rect x="50" y="284" width="467" height="105" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="64" y="314" font-size="21" font-weight="680" fill="#214f76">会话命令与成员订阅</text><text x="64" y="340" font-size="16" fill="#172f42">项目成员核权、消息幂等及取消</text><text x="64" y="363" font-size="16" fill="#172f42">会话增量与快照按读者权限投影</text></g><g class="node" data-name="渠道收件与投递"><rect x="567" y="284" width="467" height="105" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="581" y="314" font-size="21" font-weight="680" fill="#214f76">渠道收件与投递</text><text x="581" y="340" font-size="16" fill="#172f42">验签、租户与成员绑定、事件去重</text><text x="581" y="363" font-size="16" fill="#172f42">通知按原线程投递，投递失败独立重试</text></g><g class="node" data-name="服务 API 与受理"><rect x="1084" y="284" width="467" height="105" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1098" y="314" font-size="21" font-weight="680" fill="#174f45">服务 API 与受理</text><text x="1098" y="340" font-size="16" fill="#172f42">校验应用、服务修订及成员委托</text><text x="1098" y="363" font-size="16" fill="#172f42">回复 run_id；按 run 查询 service_events</text></g><polyline points="280,199 280,284" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="800,199 800,284" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1320,199 1320,284" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="800,389 800,434 270,434 270,476" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="280,389 280,434" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round"/><polyline points="1320,389 1320,434 800,434" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round"/><text x="518" y="456" font-size="16" font-weight="570" fill="#146859">正式运行：业务事实与 outbox 同事务提交</text><g class="node" data-name="PostgreSQL / 运行命令"><rect x="44" y="476" width="456" height="91" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="58" y="506" font-size="21" font-weight="680" fill="#174f45">PostgreSQL / 运行命令</text><text x="58" y="532" font-size="16" fill="#172f42">runs、outbox；稳定运行 ID 与投递状态</text></g><g class="node" data-name="Worker / Dispatch"><rect x="606" y="476" width="396" height="91" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="620" y="506" font-size="21" font-weight="680" fill="#174f45">Worker / Dispatch</text><text x="620" y="532" font-size="16" fill="#172f42">扫描待投递记录，启动或唤醒原工作流</text></g><g class="node" data-name="Temporal 服务"><rect x="1108" y="476" width="448" height="91" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1122" y="506" font-size="21" font-weight="680" fill="#174f45">Temporal 服务</text><text x="1122" y="532" font-size="16" fill="#172f42">工作流历史、任务队列、计时器与信号</text></g><polyline points="500,518 606,518" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="515" y="506" font-size="15" font-weight="570" fill="#375c72">读取</text><polyline points="1002,518 1108,518" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="1010" y="505" font-size="15" font-weight="570" fill="#375c72">启动 / 信号</text><rect x="34" y="620" width="1052" height="255" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="646" font-size="19" font-weight="680" fill="#36596a">Go Worker  /  Workflow 与 Activity 同进程注册</text><g class="node" data-name="Collaborate / Topology"><rect x="50" y="664" width="300" height="106" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="64" y="694" font-size="21" font-weight="680" fill="#174f45">Collaborate / Topology</text><text x="64" y="720" font-size="16" fill="#172f42">固定计划 DAG、依赖与等待</text><text x="64" y="743" font-size="16" fill="#172f42">安排 ExecuteStep Activity</text></g><g class="node" data-name="ExecuteStep / Harness"><rect x="393" y="664" width="305" height="106" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="407" y="694" font-size="21" font-weight="680" fill="#214f76">ExecuteStep / Harness</text><text x="407" y="720" font-size="16" fill="#172f42">报表选择已有；拟增通用 Loop</text><text x="407" y="743" font-size="16" fill="#172f42">上下文、动作选择、回合停止</text></g><g class="node" data-name="Runtime / resources"><rect x="742" y="664" width="325" height="106" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="756" y="694" font-size="21" font-weight="680" fill="#174f45">Runtime / resources</text><text x="756" y="720" font-size="16" fill="#172f42">核权与预占、按修订选择适配器</text><text x="756" y="743" font-size="16" fill="#172f42">Eino 调用入口、尝试与回执</text></g><g class="node" data-name="后台作业   ·   FollowRemote 核对原任务   /   MaintainPassages 建索引   /   CleanRetention 清理"><rect x="50" y="804" width="1017" height="52" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="64" y="834" font-size="21" font-weight="680" fill="#174f45">后台作业   ·   FollowRemote 核对原任务   /   MaintainPassages 建索引   /   CleanRetention 清理</text></g><polyline points="1108,546 1078,546 1078,599 202,599 202,664" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><text x="358" y="588" font-size="15" font-weight="570" fill="#375c72">工作流任务交给已注册 Worker；Activity 通过任务队列调度</text><polyline points="350,713 393,713" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="698,713 742,713" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><rect x="1126" y="620" width="440" height="255" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="1140" y="646" font-size="19" font-weight="680" fill="#36596a">执行后端  /  按绑定修订调用</text><g class="node" data-name="模型供应方 / 工具连接器"><rect x="1142" y="662" width="408" height="80" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1156" y="692" font-size="21" font-weight="680" fill="#174f45">模型供应方 / 工具连接器</text><text x="1156" y="718" font-size="16" fill="#172f42">模型 HTTP、受控 Python 工具调用</text></g><g class="node" data-name="外部 Agent / A2A"><rect x="1142" y="772" width="408" height="80" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1156" y="802" font-size="21" font-weight="680" fill="#174f45">外部 Agent / A2A</text><text x="1156" y="828" font-size="16" fill="#172f42">提交消息；按 task / context 查回原任务</text></g><polyline points="1067,695 1142,695" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><polyline points="1067,745 1103,745 1103,809 1142,809" fill="none" stroke="#375c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#c)"/><rect x="34" y="918" width="1532" height="138" rx="10" fill="#f0f4f6" stroke="#b7c8d0" stroke-width="1.5"/><text x="48" y="944" font-size="19" font-weight="680" fill="#36596a">持久化与能力供给  /  同一资源按发布修订被引用</text><g class="node" data-name="PostgreSQL + pgvector"><rect x="50" y="957" width="355" height="80" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="64" y="987" font-size="21" font-weight="680" fill="#174f45">PostgreSQL + pgvector</text><text x="64" y="1013" font-size="16" fill="#172f42">授权、Agent 修订、回执、片段、偏好</text></g><g class="node" data-name="内容寻址对象卷"><rect x="428" y="957" width="355" height="80" rx="7" fill="#eaf2fb" stroke="#84a4c0" stroke-width="1.6"/><text x="442" y="987" font-size="21" font-weight="680" fill="#214f76">内容寻址对象卷</text><text x="442" y="1013" font-size="16" fill="#172f42">资料原件、预览来源；拟存 Skill 包</text></g><g class="node" data-name="构建与接入目录 / Go API"><rect x="806" y="957" width="355" height="80" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="820" y="987" font-size="21" font-weight="680" fill="#174f45">构建与接入目录 / Go API</text><text x="820" y="1013" font-size="16" fill="#172f42">内置、成员构建、第三方试跑与发布</text></g><g class="node" data-name="Temporal 持久库"><rect x="1184" y="957" width="366" height="80" rx="7" fill="#e8f5ef" stroke="#74a893" stroke-width="1.6"/><text x="1198" y="987" font-size="21" font-weight="680" fill="#174f45">Temporal 持久库</text><text x="1198" y="1013" font-size="16" fill="#172f42">调度记录；业务回执另存业务库</text></g><polyline points="202,856 202,957" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="604,856 604,957" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="978,957 978,877" fill="none" stroke="#146859" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><text x="993" y="913" font-size="15" font-weight="570" fill="#146859">解析固定修订</text><text x="48" y="1080" font-size="17" font-weight="520" fill="#172f42">详图展开 Worker 决策循环、上下文依赖和网页事件协议。业务库、对象卷与 Temporal 持久库分别备份。</text><text x="44" y="1102" font-size="15" font-weight="570" fill="#455e70">绿色实框  已有实现       蓝色实框  在已有模块上扩展       橙色虚框  拟新增</text><text x="890" y="1102" font-size="15" font-weight="570" fill="#455e70">实线  调用或读写        紫色虚线  事件、观察或异步返回</text></svg>