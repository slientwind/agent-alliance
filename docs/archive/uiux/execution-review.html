let s,tab=0,opener=null;
function start(allow=false){
 s={allow,gap:true,partial:false,owner:'',reviews:[false,false],done:false,sent:false,events:['已读取三份报价。甲、丙已核对，乙 v1 缺少有效期。'],turns:[]};tab=0;$('#message').value='';$('#send').disabled=true;view('chat',false);render();
}
function view(v,focus=true){
 $('#app').dataset.view=v;
 document.querySelectorAll('.rail button[data-do="chat"],.rail button[data-do="doc"]').forEach(b=>{const active=b.dataset.do===v;b.setAttribute('aria-pressed',active);b.classList.toggle('current',active)});
 if(focus)(v==='doc'?$('#paper'):$('#flow')).focus({preventScroll:true});
}
function record(text){s.events.push(text);$('#status').textContent=text;render()}
function noteText(){return s.gap?'乙的报价单缺少有效期。请经办人向乙索取有效期依据，并确认交货周期。':'三份报价的有效期均已核实。请经办人向乙确认交货周期。'}
function version(){return (s.reviews.some(Boolean)||s.partial||!s.gap?'v1':'预览稿')}
function ref(i){return sources[i][3]+' · '+(i===1&&!s.gap?'v2':'v1')+' · 第 '+sources[i][4]+' 行'}
function paper(){
 const done=s.done?(s.partial?'已部分交付':'已交付'):s.reviews[tab]?'已审核':version();
 const missing=s.gap;
 let body=tab===0?'<div class="metrics"><div><small>已核实有效期</small><b>'+(missing?'2':'3')+' / 3</b></div><div><small>最低报价 · 人民币</small><b>¥118</b></div></div><div class="sectionhead"><h3>报价明细</h3><span class="muted">人民币 / 件</span></div><table><thead><tr><th>供应商</th><th>单价</th><th>有效期 / 依据</th></tr></thead><tbody>'+sources.map(([name,price,date],i)=>'<tr><td>供应商'+name+'</td><td>¥'+price+'</td><td>'+button('source'+i,i===1&&missing?'待补依据':date,i===1&&missing?'gap':'')+'</td></tr>').join('')+'</tbody></table>':'<ol class="list">'+(missing?'<li>向乙索取有效期，并核对报价版本。</li>':'')+'<li>请乙确认交货周期，供经办人排期。</li></ol>';
 const note=s.partial?'已保留缺项：乙的报价有效期。后续负责人：'+escapeHTML(s.owner)+'。':missing?'乙的单价已有原件依据，有效期仍待补充。':'三家报价均有有效期依据，可逐项查看原件位置。';
 $('#paper').innerHTML='<div class="docmeta">'+icon(tab===0?'FileSpreadsheet':'ListChecks')+'采购评审 / '+(tab===0?'数据表':'沟通草稿')+'</div><h2>'+names[tab]+'</h2><p class="desc">'+(tab===0?'对照三家供应商的单价、有效期与报价依据。':'供采购经办人联络供应商时逐项核对。')+'</p>'+body+'<p class="note '+(missing?'':'good')+'">'+note+'</p><div class="docfoot"><span>'+done+'</span><span>采购工作区 · 内部使用</span></div>';
 if((!s.gap||s.partial)&&!s.done&&!s.reviews[tab])$('#paper').insertAdjacentHTML('beforeend','<div class="rowact">'+button('approve','审核通过此版本','primary','Check')+'</div>');
 document.querySelectorAll('.tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',i===tab));
}
function render(){
 let lead,desc,acts='';
 if(s.done){lead=s.partial?'两份成果已部分交付。':'两份已批准成果已交付。';desc=s.sent?'飞书提醒已送达。':'飞书提醒未送达。批准版已可下载。';acts=downloadLinks()+(s.sent?'':button('retry','补发提醒','secondary','Send'))}
 else if(s.gap&&!s.partial){lead='三份报价中，两份已核实有效期。';desc='乙的单价是 118 元，但报价单上没有有效期。补上乙的依据，我就能完成比较；甲和丙的结果可以先看。';acts=button('supplement','补充乙的依据','primary','Paperclip')+(s.allow?button('partial','审核部分交付'):'')}
 else{const count=s.reviews.filter(Boolean).length;lead=count===2?'两份成果均已审核。':s.partial?'已记录缺项，等待审核部分成果。':'三份报价均已核对。';desc=count===2?'最终确认人可固定批准版本并交付。':'请逐份核对报价比较表和追问清单。已通过 '+count+' / 2。';acts=count===2?button('deliver',s.partial?'确认部分交付':'确认内部交付','primary','CheckCheck'):button('nextReview','查看待审成果','primary','ArrowRight')}
 $('#answer').innerHTML='<div class="lead">'+lead+'</div><p class="reply">'+desc+'</p><button class="fileref" data-do="table"><span class="fileicon">'+icon('FileSpreadsheet')+'</span><span class="filetext"><strong>供应商报价比较表</strong><small>3 家供应商 · '+(s.gap?'1 项待补':'有效期齐全')+'</small></span>'+icon('ChevronRight')+'</button><div class="rowact">'+acts+'</div>';
 $('#turns').innerHTML=s.turns.map(([q,a])=>'<div class="turn"><div class="user">'+escapeHTML(q)+'</div><p class="reply">'+escapeHTML(a)+'</p></div>').join('');paper();
}
function downloadLinks(){
 const data=[['报价比较表-v1.csv',['供应商,单价（元）,有效期,来源,未决项负责人',...sources.map(([n,p,d],i)=>[n,p,i===1&&s.gap?'待补':d,ref(i),i===1?s.owner:''].join(','))].join('\r\n')],['追问清单-v1.txt',noteText()+(s.partial?' 缺项负责人：'+s.owner:'')]];
 return data.map(([name,data])=>'<a class="linkbtn" download="'+name+'" href="data:text/plain;charset=utf-8,'+encodeURIComponent('\uFEFF'+data)+'">'+icon('Download')+name+'</a>').join('');
}
function show(title,content){
 const d=$('dialog');if(!d.open)opener=document.activeElement;
 $('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=content;
 if(!d.open)d.showModal();$('#dialogTitle').tabIndex=-1;$('#dialogTitle').focus();
}
function close(){if($('dialog').open)$('dialog').close()}
$('dialog').addEventListener('close',()=>{if(opener&&opener.isConnected)opener.focus({preventScroll:true});opener=null});
function pick(i){tab=i;paper();view('doc')}
function supplement(){
 if(!s.gap||s.partial){show('原补件卡已处理','<p>'+(!s.gap?'经办人已采用乙报价 v2。':'审核人已按原委托记录缺项并指定负责人。')+'</p>');return}
 show('补充乙的依据','<p>只重新核对乙的有效期，沿用甲、丙的结果。</p><label for="sourceRevision">项目内的报价原件</label><select id="sourceRevision"><option value="">选择原件</option><option value="v1">乙报价 v1 · 有效期缺失</option><option value="v2">乙报价 v2 · 含有效期说明</option></select><p id="hint" class="muted" role="status"></p>'+button('use','确认使用此版本','primary'));
 $('[data-do="use"]').disabled=true;$('#sourceRevision').onchange=e=>{$('[data-do="use"]').disabled=e.target.value!=='v2';$('#hint').textContent=e.target.value==='v1'?'这份原件仍缺有效期。':''};
}
function act(id){
 if(id==='close'){close();return}
 if(['table','questions','doc','chat','nextReview'].includes(id)){close();if(id==='chat')view('chat');else pick(id==='table'?0:id==='questions'?1:id==='nextReview'?s.reviews.findIndex(x=>!x):tab);return}
 if(/^source[0-2]$/.test(id)){const i=Number(id.slice(-1)),a=sources[i];show('供应商'+a[0]+' · 原件依据','<p>'+ref(i)+'</p><p>单价 '+a[1]+' 元 / 件。'+(i===1&&s.gap?'此版未注明有效期。':'有效至 '+a[2]+'。')+'</p>'+(i===1&&s.gap&&!s.partial?button('supplement','补充乙的依据','primary') :''));return}
 switch(id){
 case 'policy':show('本次委托范围','<p>交付报价比较表及追问清单，供企业内部评审。</p><p>'+(s.allow?'原委托允许审核人接受部分成果；须逐项保留缺口并指定后续负责人。':'原委托要求三份有效期齐全。缺项期间可以预览，须补件后再交付。')+'</p>');break;
 case 'sourceMenu':show('本次报价原件',sources.map((a,i)=>button('source'+i,'供应商'+a[0]+' · '+ref(i),'navitem','FileText')).join(''));break;
 case 'supplement':supplement();break;
 case 'use':if($('#sourceRevision')?.value==='v2'&&s.gap&&!s.partial){s.gap=false;close();record('经办人采用乙 v2。甲、丙沿用原结果，形成两份待审成果。');view('chat')}break;
 case 'partial':if(!s.allow||!s.gap||s.partial)return;show('审核部分交付','<p>原委托允许部分交付。乙的有效期将作为未决项保留在两份成果中。</p><label for="owner">指定后续负责人</label><select id="owner"><option value="">请选择</option><option>采购经办人林予</option><option>采购主管周宁</option></select>'+button('accept','接受缺项并送审','primary'));$('[data-do="accept"]').disabled=true;$('#owner').onchange=e=>$('[data-do="accept"]').disabled=!e.target.value;break;
 case 'accept':if(s.allow&&s.gap&&!s.partial&&$('#owner')?.value){s.owner=$('#owner').value;s.partial=true;close();record('审核人接受原委托允许的缺项，后续负责人为'+s.owner+'。两份部分成果进入版本审核。');view('chat')}break;
 case 'approve':if((!s.gap||s.partial)&&!s.done&&!s.reviews[tab]){s.reviews[tab]=true;record('审核人已批准「'+names[tab]+' v1」。');if(s.reviews.every(Boolean))view('chat');else pick(s.reviews.findIndex(x=>!x))}break;
 case 'deliver':if(!s.done&&s.reviews.every(Boolean)&&(!s.gap||(s.allow&&s.owner&&s.partial))){s.done=true;record((s.partial?'已部分交付':'已交付')+'两份批准版本。飞书提醒未送达。');view('chat')}break;
 case 'retry':if(s.done&&!s.sent){s.sent=true;record('已获得模拟送达回执，仅补发了原提醒。')}break;
 case 'log':show('任务记录','<ol class="list">'+s.events.map(t=>'<li>'+escapeHTML(t)+'</li>').join('')+'</ol>'+button('supplement','查看最初的补件卡'));break;
 case 'scenarios':show('切换演示委托','<p>选择后从第一份报价开始新的本地演示。</p>'+button('strict','必交项齐全后交付','navitem','ShieldCheck')+button('allow','原委托允许部分交付','navitem','ListChecks'));break;
 case 'strict':case 'allow':close();start(id==='allow');break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(b)act(b.dataset.do)});
$('#message').oninput=e=>$('#send').disabled=!e.target.value.trim();
$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(e.target.value.trim())$('#form').requestSubmit()}};
$('#form').onsubmit=e=>{e.preventDefault();const q=$('#message').value.trim();if(!q)return;let a;
 if(/单价|价格|最低|多少钱/.test(q))a='甲 120 元、乙 118 元、丙 126 元，均按件计价。点报价表中的有效期可查看各行依据。';
 else if(/依据|来源|有效期|资料/.test(q))a=s.gap?'甲有效至 12 月 15 日，丙有效至 12 月 12 日。乙 v1 缺有效期；可在成果预览中点「待补依据」。':'甲、乙、丙的有效期分别为 12 月 15 日、20 日、12 日。乙的依据是 B-07 v2 第 4 行。';
 else if(/负责人|谁|下一步|状态|进度/.test(q))a=s.done?'两份批准版已交付。'+(s.owner?'乙的缺项由'+s.owner+'跟进。':''):s.partial?'乙的缺项由'+s.owner+'跟进，审核人需核对两份部分成果。':s.gap?'请采购经办人补充乙的有效期依据。':'请按版本核对两份成果，然后由最终确认人交付。';
 else a='这个本地样例可查询三家报价、有效期依据和当前负责人。';
 s.turns.push([q,a]);$('#message').value='';$('#send').disabled=true;render();$('#flow').scrollTop=$('#flow').scrollHeight;$('#status').textContent=a};
populateIcons();start();
</script></body></html>
