<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Alliance vNext · 企业版 Personal Agent 交互原型</title>
<style>
:root, [data-theme="light"] {
  color-scheme: light;
  --bg-rail: #f6f7f4;
  --bg-main: #ffffff;
  --bg-canvas: #f1f4f0;
  --bg-surface: #ffffff;
  --bg-subtle: #f4f6f3;
  --bg-hover: #eaefea;
  --bg-active: #e1ebe4;
  --ink-primary: #1d2621;
  --ink-secondary: #55615b;
  --ink-muted: #7d8a83;
  --border: #dde3de;
  --border-strong: #c5d0c8;
  --brand: #205a45;
  --brand-hover: #174534;
  --brand-soft: #e6f1eb;
  --brand-ink: #1b4d3a;
  --amber: #925715;
  --amber-soft: #fbf3e4;
  --amber-border: #e7cfa3;
  --danger: #b83737;
  --danger-soft: #fdecec;
  --info: #255d87;
  --info-soft: #eaf2f8;
  --shadow-sm: 0 2px 8px rgba(21, 42, 25, 0.05);
  --shadow-md: 0 6px 24px rgba(21, 42, 25, 0.08);
  --shadow-lg: 0 20px 60px rgba(15, 31, 20, 0.16);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg-rail: #161a18;
  --bg-main: #1c211e;
  --bg-canvas: #141816;
  --bg-surface: #232926;
  --bg-subtle: #1e2421;
  --bg-hover: #2a322e;
  --bg-active: #23382e;
  --ink-primary: #eef2ef;
  --ink-secondary: #a2b0a8;
  --ink-muted: #73827a;
  --border: #2d3631;
  --border-strong: #3e4c44;
  --brand: #3ca37c;
  --brand-hover: #49b88e;
  --brand-soft: #1b342a;
  --brand-ink: #6ed4ab;
  --amber: #eab362;
  --amber-soft: #332818;
  --amber-border: #5c4624;
  --danger: #f07474;
  --danger-soft: #381f1f;
  --info: #74b8e8;
  --info-soft: #1a2d3d;
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-main); color: var(--ink-primary); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Microsoft YaHei", system-ui, sans-serif; font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

/* App Shell */
.app-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; height: 100dvh; transition: grid-template-columns .18s ease; overflow: hidden; }
.app-shell.collapsed { grid-template-columns: 56px minmax(0, 1fr); }

/* Sidebar */
.rail { background: var(--bg-rail); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; gap: 4px; user-select: none; overflow: hidden; }
.rail-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; gap: 8px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 17px; letter-spacing: -.03em; color: var(--ink-primary); white-space: nowrap; overflow: hidden; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 15px; height: 15px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--ink-secondary); flex: none; transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--bg-hover); color: var(--ink-primary); }
.icon-btn.active { background: var(--bg-active); color: var(--brand-ink); }

.rail-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; font-size: 13.5px; color: var(--ink-primary); text-align: left; transition: background .12s; white-space: nowrap; overflow: hidden; }
.rail-btn:hover { background: var(--bg-hover); }
.rail-btn.active { background: var(--bg-active); color: var(--brand-ink); font-weight: 600; }
.rail-btn.new-chat { background: var(--bg-surface); border: 1px solid var(--border); font-weight: 550; margin-bottom: 2px; box-shadow: var(--shadow-sm); }
.rail-btn.new-chat:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.rail-btn .kbd { margin-left: auto; font-size: 11px; color: var(--ink-muted); padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; }
.rail-btn .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }
.rail-btn svg { width: 17px; height: 17px; color: var(--ink-secondary); }
.rail-btn.active svg, .rail-btn.new-chat svg { color: var(--brand-ink); }

.rail-section { font-size: 11.5px; color: var(--ink-muted); padding: 12px 10px 4px; font-weight: 500; white-space: nowrap; }
.rail-scroll { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
.rail-scroll::-webkit-scrollbar { width: 4px; }
.rail-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.thread-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-secondary); width: 100%; text-align: left; white-space: nowrap; overflow: hidden; transition: background .12s; }
.thread-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
.thread-item.active { background: var(--bg-active); color: var(--ink-primary); font-weight: 550; }
.thread-item span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot-green { background: #2d8a64; }
.dot-amber { background: #d4882a; }
.dot-red { background: #cf4a4a; }
.dot-blue { background: #3b82b6; }
.dot-muted { background: var(--ink-muted); }

.rail-foot { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.profile-btn { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 9px; width: 100%; text-align: left; }
.profile-btn:hover { background: var(--bg-hover); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); font-weight: 650; font-size: 12.5px; display: grid; place-items: center; flex: none; }
.profile-meta { min-width: 0; flex: 1; }
.profile-meta strong { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-meta small { display: block; font-size: 11px; color: var(--ink-muted); }

.app-shell.collapsed .brand-text,
.app-shell.collapsed .space-switch-text,
.app-shell.collapsed .space-caret,
.app-shell.collapsed .rail-btn span,
.app-shell.collapsed .rail-btn .kbd,
.app-shell.collapsed .rail-btn .badge,
.app-shell.collapsed .rail-section,
.app-shell.collapsed .rail-scroll,
.app-shell.collapsed .profile-meta,
.app-shell.collapsed .profile-caret { display: none; }
.app-shell.collapsed .rail { align-items: center; padding: 12px 6px; }
.app-shell.collapsed .rail-top { flex-direction: column; gap: 8px; padding: 2px 0 8px; }
.app-shell.collapsed .rail-btn, .app-shell.collapsed .profile-btn, .app-shell.collapsed .space-switcher { justify-content: center; width: 38px; height: 38px; padding: 0; }

.space-switcher { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 10px; background: var(--brand-soft); border: 1px solid var(--border); color: var(--brand-ink); font-size: 13px; font-weight: 600; margin-bottom: 4px; text-align: left; transition: all .14s; }
.space-switcher:hover { border-color: var(--brand); }
.space-switcher svg { width: 15px; height: 15px; flex: none; }
.space-switch-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prov-bar { padding: 10px 13px; border-radius: 10px; background: var(--info-soft); border: 1px solid var(--border); font-size: 12.5px; color: var(--ink-primary); display: flex; flex-direction: column; gap: 4px; }
.l2-card { border: 1.5px solid var(--amber-border); background: var(--amber-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.l2-card.done { border-color: var(--brand); background: var(--brand-soft); }
.cite-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-ink); font-size: 12px; font-weight: 550; vertical-align: baseline; margin: 0 2px; }
.cite-chip:hover { filter: brightness(0.95); }

/* Main Container */
.main-area { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg-main); position: relative; overflow: hidden; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid transparent; gap: 12px; }
.topbar.bordered { border-bottom-color: var(--border); }
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }

/* Buttons & Badges */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: 9px; font-size: 13px; font-weight: 550; transition: background .12s, border-color .12s, color .12s; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--bg-surface); border: 1px solid var(--border); color: var(--ink-primary); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn-ghost { color: var(--ink-secondary); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--ink-primary); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 550; white-space: nowrap; }
.pill-green { background: var(--brand-soft); color: var(--brand-ink); }
.pill-amber { background: var(--amber-soft); color: var(--amber); }
.pill-blue { background: var(--info-soft); color: var(--info); }
.pill-red { background: var(--danger-soft); color: var(--danger); }
.pill-muted { background: var(--bg-subtle); color: var(--ink-secondary); border: 1px solid var(--border); }

/* Toggle Switch */
.toggle-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--border); color: var(--ink-secondary); background: var(--bg-surface); transition: all .14s; }
.toggle-chip:hover { border-color: var(--border-strong); color: var(--ink-primary); }
.toggle-chip.on { background: var(--brand-soft); border-color: transparent; color: var(--brand-ink); font-weight: 550; }
.toggle-chip svg { width: 14px; height: 14px; }

/* View 1: Start Screen */
.start-screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 64px; }
.start-inner { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
.start-greeting { text-align: center; font-size: clamp(26px, 2.8vw, 33px); font-weight: 600; letter-spacing: -.03em; color: var(--ink-primary); margin-bottom: 4px; }
.start-sub { text-align: center; font-size: 13.5px; color: var(--ink-secondary); margin-top: -14px; }

/* Composer Card (ChatGPT / Claude style) */
.composer-card { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 22px; padding: 14px 16px 10px; box-shadow: var(--shadow-md); transition: border-color .15s, box-shadow .15s; position: relative; }
.composer-card:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow-md); }
.composer-context { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.context-tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 8px; font-size: 12px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 550; }
.context-tag.file { background: var(--bg-subtle); color: var(--ink-primary); border: 1px solid var(--border); font-weight: 500; }
.context-tag button { display: grid; place-items: center; opacity: .7; }
.context-tag button:hover { opacity: 1; }
.composer-card textarea { width: 100%; border: 0; background: transparent; resize: none; font-size: 15px; line-height: 1.6; min-height: 52px; max-height: 180px; outline: none; color: var(--ink-primary); }
.composer-card textarea::placeholder { color: var(--ink-muted); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.composer-left, .composer-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.send-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; transition: background .12s, transform .1s; }
.send-btn:hover:not(:disabled) { background: var(--brand-hover); }
.send-btn:disabled { background: var(--bg-hover); color: var(--ink-muted); opacity: 1; }
.send-btn svg { width: 17px; height: 17px; }

.starter-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.starter-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-surface); font-size: 13px; color: var(--ink-secondary); transition: all .14s; }
.starter-chip:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--ink-primary); }
.starter-chip svg { width: 15px; height: 15px; color: var(--brand-ink); }

.recent-block { margin-top: 12px; }
.recent-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-muted); margin-bottom: 8px; padding: 0 2px; }
.recent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.recent-card { text-align: left; padding: 12px 13px; border-radius: 13px; border: 1px solid var(--border); background: var(--bg-surface); display: flex; flex-direction: column; gap: 6px; transition: all .14s; }
.recent-card:hover { border-color: var(--border-strong); background: var(--bg-subtle); transform: translateY(-1px); }
.recent-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.recent-card strong { font-size: 13px; font-weight: 600; color: var(--ink-primary); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-card small { font-size: 11.5px; color: var(--ink-muted); }

/* View 2: Conversation + Dynamic Canvas */
.chat-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
.chat-split.has-canvas { grid-template-columns: minmax(360px, 0.92fr) minmax(420px, 1.08fr); }
.chat-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.chat-stream { flex: 1; overflow-y: auto; padding: 20px clamp(18px, 3vw, 44px) 16px; }
.chat-stream-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.chat-composer-wrap { padding: 8px clamp(16px, 2.5vw, 36px) 16px; max-width: 820px; width: 100%; margin: 0 auto; }

.msg-user { align-self: flex-end; max-width: 86%; background: var(--bg-subtle); border: 1px solid var(--border); padding: 11px 15px; border-radius: 18px 18px 4px 18px; font-size: 14.5px; line-height: 1.65; }
.msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.msg-ai { display: flex; flex-direction: column; gap: 10px; }
.ai-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.ai-badge-icon { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.ai-badge-icon.ext { background: var(--info); }
.ai-badge-icon svg { width: 13px; height: 13px; }

/* Thinking / Tool Accordion */
.trace-box { border: 1px solid var(--border); border-radius: 11px; background: var(--bg-subtle); overflow: hidden; }
.trace-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--ink-secondary); text-align: left; }
.trace-toggle:hover { background: var(--bg-hover); color: var(--ink-primary); }
.trace-toggle svg { width: 14px; height: 14px; }
.trace-steps { border-top: 1px solid var(--border); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.trace-step { display: flex; align-items: center; gap: 8px; }
.trace-step .step-time { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }

.ai-body { font-size: 15px; line-height: 1.72; color: var(--ink-primary); }
.ai-body p + p { margin-top: 10px; }
.ai-body ul { margin: 8px 0; padding-left: 20px; }
.ai-body li { margin: 4px 0; }

.artifact-card { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface); text-align: left; width: 100%; transition: all .14s; }
.artifact-card:hover { border-color: var(--brand); background: var(--bg-subtle); }
.artifact-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.artifact-card strong { display: block; font-size: 13.5px; font-weight: 600; }
.artifact-card small { display: block; font-size: 12px; color: var(--ink-secondary); }

.inline-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.msg-toolbar { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
.msg-toolbar .icon-btn { width: 28px; height: 28px; }
.msg-toolbar .tool-text { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; font-size: 12px; color: var(--ink-muted); }
.msg-toolbar .tool-text:hover { background: var(--bg-hover); color: var(--ink-primary); }
.msg-toolbar .tool-text svg { width: 13px; height: 13px; }

/* Right Canvas Workspace */
.canvas-pane { background: var(--bg-canvas); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.canvas-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg-rail); gap: 8px; flex-wrap: wrap; }
.canvas-tabs { display: flex; align-items: center; gap: 4px; }
.canvas-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; font-size: 13px; color: var(--ink-secondary); font-weight: 500; }
.canvas-tab:hover { background: var(--bg-hover); color: var(--ink-primary); }
.canvas-tab.active { background: var(--bg-surface); color: var(--brand-ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.canvas-tab svg { width: 14px; height: 14px; }
.canvas-body { flex: 1; overflow-y: auto; padding: 18px 22px 26px; }
.paper { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 26px; box-shadow: var(--shadow-sm); max-width: 720px; margin: 0 auto; }
.paper-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--brand-ink); font-weight: 600; margin-bottom: 10px; }
.paper h2 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 6px; }
.paper .paper-desc { font-size: 13.5px; color: var(--ink-secondary); margin-bottom: 18px; }
.metric-strip { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--bg-subtle); border-top: 2px solid var(--brand); border-radius: 6px; padding: 14px 0; margin-bottom: 20px; }
.metric-strip > div { padding: 0 16px; }
.metric-strip > div + div { border-left: 1px solid var(--border); }
.metric-strip small { display: block; font-size: 11.5px; color: var(--ink-secondary); }
.metric-strip b { display: block; font-size: 24px; font-weight: 650; color: var(--brand-ink); margin-top: 2px; }

.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th, .data-table td { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table th { font-size: 12px; color: var(--ink-muted); font-weight: 550; }
.data-table tr:hover td { background: var(--bg-subtle); }
.data-table .right { text-align: right; }
.row-edit-btn { opacity: 0; font-size: 11.5px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--ink-secondary); transition: opacity .12s; }
.data-table tr:hover .row-edit-btn { opacity: 1; }
.row-edit-btn:hover { border-color: var(--brand); color: var(--brand-ink); }

.callout { padding: 11px 14px; border-radius: 9px; font-size: 13px; line-height: 1.6; margin-top: 16px; border-left: 3px solid var(--amber); background: var(--amber-soft); color: var(--ink-primary); }
.callout.good { border-left-color: var(--brand); background: var(--brand-soft); }
.callout.info { border-left-color: var(--info); background: var(--info-soft); }

.collab-bar { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border-strong); display: flex; flex-direction: column; gap: 10px; }
.checklist-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bg-subtle); }
.avatar-stack { display: inline-flex; align-items: center; }
.avatar-stack .mini-av { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); border: 2px solid var(--bg-main); font-size: 11px; font-weight: 650; display: grid; place-items: center; margin-left: -7px; position: relative; }
.avatar-stack .mini-av:first-child { margin-left: 0; }
.avatar-stack .mini-av.b2 { background: var(--info-soft); color: var(--info); }
.avatar-stack .mini-av.b3 { background: var(--amber-soft); color: var(--amber); }
.comment-card { padding: 10px 12px; border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.comment-card.resolved { opacity: .65; }
.comment-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eco-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border); font-size: 13px; }
.meta-tags { display: flex; flex-wrap: wrap; gap: 5px; }

/* Full-page Workspace Views (Agents, Studio, Connect, Inbox, Automations) */
.page-scroll { flex: 1; overflow-y: auto; padding: 24px clamp(20px, 3vw, 40px) 40px; }
.page-inner { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-header h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.page-header p { font-size: 13.5px; color: var(--ink-secondary); margin-top: 4px; }

.filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search-input { display: flex; align-items: center; gap: 8px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 9px; padding: 6px 11px; min-width: 240px; }
.search-input input { border: 0; background: transparent; outline: none; font-size: 13.5px; width: 100%; }
.search-input svg { width: 15px; height: 15px; color: var(--ink-muted); }
.chip-tab { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; color: var(--ink-secondary); border: 1px solid var(--border); background: var(--bg-surface); }
.chip-tab:hover { background: var(--bg-hover); color: var(--ink-primary); }
.chip-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 550; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.agent-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color .14s, box-shadow .14s; }
.agent-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.agent-card-top { display: flex; align-items: flex-start; gap: 12px; }
.agent-tile { width: 40px; height: 40px; border-radius: 11px; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.agent-tile.ext { background: var(--info-soft); color: var(--info); }
.agent-tile.personal { background: var(--amber-soft); color: var(--amber); }
.agent-card h3 { font-size: 15px; font-weight: 600; }
.agent-card .desc { font-size: 13px; color: var(--ink-secondary); line-height: 1.55; flex: 1; }
.agent-card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); gap: 8px; }

/* View 4: Conversational Studio (50/50 split) */
.studio-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.studio-split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.studio-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.studio-col + .studio-col { border-left: 1px solid var(--border); background: var(--bg-canvas); }
.studio-col-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--bg-rail); gap: 10px; }
.studio-body { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.studio-foot { padding: 12px 22px; border-top: 1px solid var(--border); background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dropzone { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 14px 16px; background: var(--bg-subtle); display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; transition: border-color .14s, background .14s; }
.dropzone:hover { border-color: var(--brand); background: var(--brand-soft); }
.cap-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.diff-box { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg-subtle); font-size: 12.5px; line-height: 1.6; }
.diff-add { color: var(--brand-ink); background: var(--brand-soft); padding: 1px 4px; border-radius: 4px; font-weight: 550; }
.refine-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.refine-block { padding: 10px 12px; border-radius: 8px; background: var(--bg-subtle); border: 1px solid transparent; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; transition: border-color .12s; }
.refine-block:hover { border-color: var(--brand); }

/* View 5: External Connect Wizard */
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); font-weight: 500; }
.step-item.active { color: var(--ink-primary); font-weight: 600; }
.step-item.done { color: var(--brand-ink); }
.step-num { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.step-item.active .step-num { background: var(--brand); border-color: var(--brand); color: #fff; }
.step-item.done .step-num { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
.step-line { width: 32px; height: 1px; background: var(--border-strong); }
.proto-card { text-align: left; padding: 16px; border: 1.5px solid var(--border); border-radius: 13px; background: var(--bg-surface); display: flex; flex-direction: column; gap: 7px; transition: all .14s; }
.proto-card:hover { border-color: var(--border-strong); }
.proto-card.selected { border-color: var(--brand); background: var(--brand-soft); }
.form-panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 780px; }
.field-row { display: flex; flex-direction: column; gap: 6px; }
.field-row label { font-size: 13px; font-weight: 600; color: var(--ink-primary); }
.field-input, .field-select { width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg-main); font-size: 13.5px; outline: none; }
.field-input:focus, .field-select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

/* View 7: Fullscreen Enterprise Admin */
.admin-shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
.admin-rail { background: var(--bg-rail); border-right: 1px solid var(--border); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.admin-back { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--brand-ink); background: var(--brand-soft); margin-bottom: 12px; }
.admin-back:hover { filter: brightness(0.96); }
.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 13px; padding: 15px 16px; display: flex; flex-direction: column; gap: 6px; }
.kpi-card small { font-size: 12px; color: var(--ink-secondary); display: flex; align-items: center; justify-content: space-between; }
.kpi-card .kpi-val { font-size: 25px; font-weight: 650; letter-spacing: -.02em; color: var(--ink-primary); }
.kpi-card .kpi-sub { font-size: 11.5px; color: var(--ink-muted); line-height: 1.45; }

.chart-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 14px; }
.panel-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head h3 { font-size: 15px; font-weight: 600; }

.funnel-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.funnel-step { padding: 10px 12px; border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--border); }
.funnel-step small { font-size: 11.5px; color: var(--ink-secondary); display: block; }
.funnel-step strong { font-size: 18px; font-weight: 650; display: block; margin: 2px 0; }
.funnel-bar { height: 5px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 6px; }
.funnel-bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }

.tier-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tier-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 13px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.tier-route { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 9px; background: var(--bg-subtle); font-size: 12.5px; }
.tier-route-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Popovers, Modals, Drawers & Toast */
.popover { position: absolute; z-index: 40; background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 220px; display: flex; flex-direction: column; gap: 2px; }
.popover-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-align: left; width: 100%; color: var(--ink-primary); }
.popover-item:hover { background: var(--bg-hover); }
.popover-item small { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }
.popover-item svg { width: 15px; height: 15px; color: var(--ink-secondary); }
.popover-sep { height: 1px; background: var(--border); margin: 4px 6px; }

.backdrop { position: fixed; inset: 0; background: rgba(12, 22, 16, 0.45); backdrop-filter: blur(2px); z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal-card { width: min(560px, 100%); max-height: 84vh; overflow-y: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.drawer-wrap { position: fixed; inset: 0; background: rgba(12, 22, 16, 0.4); z-index: 60; display: flex; justify-content: flex-end; }
.drawer-card { width: min(540px, 94vw); height: 100%; background: var(--bg-surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.span-row { display: grid; grid-template-columns: 140px 1fr 72px; align-items: center; gap: 10px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.span-track { height: 16px; background: var(--bg-subtle); border-radius: 5px; position: relative; overflow: hidden; }
.span-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: var(--brand); }
.span-bar.ext { background: var(--info); }
.span-bar.tool { background: #5a8c72; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink-primary); color: var(--bg-main); padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); z-index: 90; pointer-events: none; opacity: 0; transition: opacity .18s; }
.toast.show { opacity: 1; }

@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chart-grid { grid-template-columns: 1fr; }
}
@media (max-width: 960px) {
  .chat-split.has-canvas { grid-template-columns: 1fr; }
  .canvas-pane { border-left: 0; border-top: 1px solid var(--border); max-height: 50vh; }
  .studio-split { grid-template-columns: 1fr; overflow-y: auto; }
  .recent-grid { grid-template-columns: 1fr; }
  .admin-shell { grid-template-columns: 60px minmax(0, 1fr); }
  .admin-rail span { display: none; }
}
</style>

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function setTheme(next) {
  state.theme = next;
  document.documentElement.setAttribute('data-theme', next);
  render();
  toast(next === 'dark' ? '已切换为深色主题' : '已切换为浅色主题');
}

function agentById(id) {
  return state.agents.find(a => a.id === id) || state.agents[0];

function scopePill(agent) {
  if (agent.kind === 'builtin') return `<span class="pill pill-green">${esc(agent.scope)}</span>`;

  if (agent.kind === 'personal') return `<span class="pill pill-amber">${esc(agent.scope)}</span>`;
  return `<span class="pill pill-blue">${esc(agent.scope)}</span>`;
}

function renderAgentsView() {
  const filters = [
    ['all', '全部'],
    ['builtin', '官方内置'],
    ['external', '外部接入'],
    ['team', '团队共享'],
    ['personal', '我的私有'],
  ];
  const ecoFilters = [
    ['all', '全部'],
    ['skill', 'Skill 技能包'],
    ['agent', '外部 Agent'],
    ['mcp', 'MCP 工具'],
    ['approved', '企业已准入'],
    ['loaded', '我已加载'],
    ['discovered', '新发现候选'],
  ];
  const loadedCount = state.ecosystemItems.filter(x => x.loaded).length;
  const filtered = state.agents.filter(a => {
    const matchCat = state.agentFilter === 'all'
      || (state.agentFilter === 'external' ? a.kind.startsWith('external') : a.kind === state.agentFilter);
    const q = state.agentQuery.trim().toLowerCase();
    const matchQ = !q || a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  const filteredEco = state.ecosystemItems.filter(item => {
    const q = state.agentQuery.trim().toLowerCase();
    const matchQ = !q || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.source.toLowerCase().includes(q);
    if (!matchQ) return false;
    if (state.ecoFilter === 'all') return true;
    if (['skill', 'agent', 'mcp'].includes(state.ecoFilter)) return item.type === state.ecoFilter;
    if (state.ecoFilter === 'approved') return item.status === 'approved';
    if (state.ecoFilter === 'loaded') return item.loaded;
    if (state.ecoFilter === 'discovered') return item.status === 'discovered';
    return true;
  });

  return `

  <div class="page-scroll">
    <div class="page-inner">
      ${state.marketTab === 'enterprise' ? `
      <div class="page-header">
        <div>

      </div>
      <div class="card-grid">
        ${filtered.map(a => `
        <article class="agent-card">
          <div class="agent-card-top">
            <span class="agent-tile ${a.kind.startsWith('external')?'ext':(a.kind==='personal'?'personal':'')}">${ic(a.kind.startsWith('external')?'Plug':'Bot', 19)}</span>

              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <h3>${esc(item.name)}</h3>
                <span class="pill ${item.status==='approved'?'pill-green':'pill-amber'}">${item.status==='approved'?'企业已准入':'新发现候选'}</span>

          <div style="font-size:12.5px;display:flex;justify-content:space-between"><span>用量统计</span><strong class="num">${ag.disclosed ? 'In 2,410 · Out 840 · Cache 620' : '外部未披露'}</strong></div>
          <div style="font-size:12.5px;display:flex;justify-content:space-between"><span>质量信号</span><strong style="color:var(--brand-ink)">用户已下载产物 + 点 👍（有效完成）</strong></div>
        </div>
      </div>
    </div>`;
  }
  return html;
}

function render() {
  const root = document.getElementById('root');
  if (state.route === 'admin') {
    root.innerHTML = renderAdminShell() + renderOverlays();
  } else {
    let main = '';
    if (state.route === 'chat-new') main = renderStartView();
    else if (state.route === 'chat') main = renderChatView();
    else if (state.route === 'knowledge') main = renderKnowledgeView();
    else if (state.route === 'agents') main = renderAgentsView();
    else if (state.route === 'studio') main = renderStudioView();
    else if (state.route === 'connect') main = renderConnectView();
    else if (state.route === 'automations') main = renderAutomationsView();
    else if (state.route === 'inbox') main = renderInboxView();

    root.innerHTML = `
    <div class="app-shell ${state.collapsed ? 'collapsed' : ''}">
      ${renderSidebar()}
      <main class="main-area">${main}</main>
    </div>${renderOverlays()}`;
  }

  // Bind live inputs without losing focus on simple actions
  const ci = document.getElementById('composerInput');
  if (ci) {
    ci.oninput = e => {
      state.composerText = e.target.value;
      const sendBtn = document.querySelector('.send-btn');
      if (sendBtn) sendBtn.disabled = !state.composerText.trim() && !state.composerFiles.length;
    };
    ci.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        if (state.composerText.trim() || state.composerFiles.length) {
          handleAction(state.route === 'chat' ? 'send-thread' : 'send-new');
        }
      }
    };
  }
  const as = document.getElementById('agentSearchInput');
  if (as) as.oninput = e => { state.agentQuery = e.target.value; render(); document.getElementById('agentSearchInput')?.focus(); };
  const cmd = document.getElementById('cmdInput');
  if (cmd) cmd.oninput = e => { state.cmdQuery = e.target.value; render(); const el = document.getElementById('cmdInput'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
}

function handleAction(act, el) {
  const d = el ? el.dataset : {};
  switch (act) {
    case 'toggle-rail': state.collapsed = !state.collapsed; state.popover = null; break;
    case 'toggle-theme': setTheme(state.theme === 'light' ? 'dark' : 'light'); state.popover = null; state.cmdOpen = false; return;
    case 'toggle-role':
      state.role = state.role === 'admin' ? 'member' : 'admin';
      state.popover = null;
      if (state.role === 'member' && state.route === 'admin') state.route = 'chat-new';
      toast(state.role === 'admin' ? '已切换为「企业管理员」视角（侧栏可见企业管理入口）' : '已切换为「普通业务员工」视角（已隐藏企业管理后台）');
      break;
    case 'go':
      state.route = d.to; state.popover = null; state.cmdOpen = false;
      if (d.to === 'chat-new') state.composerText = '';
      break;
    case 'go-admin': state.route = 'admin'; state.adminTab = 'monitor'; state.popover = null; state.cmdOpen = false; break;
    case 'go-admin-tab': state.route = 'admin'; state.adminTab = d.tab; state.cmdOpen = false; break;
    case 'admin-tab': state.adminTab = d.tab; break;
    case 'open-thread':
      state.activeThreadId = d.id; state.route = 'chat'; state.canvasOpen = true; state.canvasTab = 0; state.popover = null; state.cmdOpen = false; state.composerText = '';
      break;
    case 'toggle-pop': state.popover = state.popover === d.pop ? null : d.pop; break;
    case 'add-file': state.composerFiles.push(d.name); state.popover = null; toast('已附加资料：' + d.name); break;
    case 'rm-file': state.composerFiles.splice(Number(d.idx), 1); break;
    case 'pick-agent': state.composerAgent = d.id; state.popover = null; break;
    case 'pick-tier': state.composerTier = d.tier; state.popover = null; break;
    case 'toggle-deep': state.deepThink = !state.deepThink; break;
    case 'toggle-web': state.webSearch = !state.webSearch; break;
    case 'send-new': {
      const q = state.composerText.trim() || '请帮我处理刚刚上传的文件';
      const id = 't-' + Date.now();
      state.threads[id] = { id, group: '今天', title: q.slice(0, 18), dot: 'green', agentId: state.composerAgent, extraTurns: [{ q, a: `已由「${agentById(state.composerAgent).name}」按 L0 个人助手策略免审批直达处理完成。你可以继续追问修改，或点击底部将本次做法沉淀为个人私有 Agent。` }], feedback: null };
      state.activeThreadId = id; state.route = 'chat'; state.canvasOpen = false; state.composerText = ''; state.composerFiles = [];
      break;
    }
    case 'send-thread': {
      const q = state.composerText.trim();
      if (!q) return;
      const th = state.threads[state.activeThreadId];
      let a = '已收到你的补充要求并完成更新。右侧工作区与最新版本保持同步，如需局部修改可直接点对应行。';
      if (q.includes('修改') || q.includes('局部')) a = '已按你的局部修改意见精准调整对应条目，其他已确认内容保持不变。';
      th.extraTurns.push({ q, a });
      state.composerText = '';
      render();
      const st = document.getElementById('chatStream');
      if (st) st.scrollTop = st.scrollHeight;
      return;
    }
    case 'toggle-trace': state.traceOpen[d.id] = !state.traceOpen[d.id]; break;
    case 'toggle-canvas': state.canvasOpen = !state.canvasOpen; break;
    case 'open-canvas': state.canvasOpen = true; state.canvasTab = Number(d.tab || 0); break;
    case 'canvas-tab': state.canvasTab = Number(d.tab); break;
    case 'toggle-collab':
      state.collabMode = !state.collabMode;
      toast(state.collabMode ? '已开启协作审签模式：右侧展示交付清单与按版本审核' : '已切回轻量个人助手态');
      break;
    case 'open-supplement': state.modal = { type: 'supplement' }; break;
    case 'confirm-supplement': {

      toast('已局部重算乙报价 v2，甲、丙结果已沿用');
      break;
    }
    case 'show-source':
      state.modal = { type: 'source', title: d.title, src: d.src, isGap: d.gap === '1' };

    case 'inline-edit':
      state.composerText = `[局部修改 · ${d.target}] 请帮我调整这里的表述和口径：`;

    case 'approve-tab':

    case 'download-artifact': toast('已下载成果文件（同时静默记入轻量任务有效完成信号）'); break;

    }
    case 'open-collab-modal': state.modal = { type: 'collab' }; break;

        toast(`${name} 已在当前协同成员列表中`);
      }
      break;
    }
    case 'rm-collab-member':
      state.collaborators = state.collaborators.filter(c => c.id !== d.id);
      toast('已移出该协作成员并即时撤销其任务访问权');
      break;
    case 'comment-row':
      state.collabMode = true;
      state.commentAnchor = d.target;
      render();

    case 'add-comment': {
      const input = document.getElementById('collabCommentInput');

      state.commentDraft = '';
      toast('协同评论已发布，已自动通知被 @ 的同事');
      break;
    }
    case 'toggle-comment': {
      const c = state.collabComments.find(x => x.id === d.id);
      if (c) { c.resolved = !c.resolved; toast(c.resolved ? '评论已标为解决' : '已重新打开该评论'); }
      break;
    }
    case 'use-agent': state.composerAgent = d.id; state.route = 'chat-new'; toast(`已选中 @${agentById(d.id).name}，直接输入需求即可开始`); break;
    case 'studio-tab': state.studioTab = d.tab; break;
    case 'studio-cap': state.studioCaps[d.cap] = !state.studioCaps[d.cap]; break;
    case 'studio-load-sample': state.studioSampleLoaded = true; toast('已从标杆文件反向提炼格式与口径规范'); break;
    case 'studio-refine': state.studioRefined = true; toast('已根据右侧指哪改哪自动更新左侧规则 Diff'); break;
    case 'studio-publish': {
      if (d.scope === 'personal') {
        state.studioScope = '个人私有已启用';
        if (!state.agents.some(a => a.id === 'custom-new')) {
          state.agents.unshift({ id: 'custom-new', name: state.studioName + '（我的）', kind: 'personal', scope: '个人私有', desc: '通过左聊右测构建并免审批立即启用的个人工作助手。', owner: '林予（本人）', calls: 1, execRate: 100, effRate: 100, collabRate: null, p50: '2.1s', p95: '3.2s', tokens: '0.01M', cost: '¥0.3', disclosed: true, health: 'ok' });

      } else if (d.scope === 'team') {

        toast('样例检查通过，已共享给采购部全部成员');
      } else {

        state.releases.unshift({ id: 'rel-' + Date.now(), name: state.studioName, kind: '自建全企上架', owner: '林予 · 采购部', checks: '1/1 样例通过', status: 'pending' });
        toast('已提交至「企业管理 → 发布审核」队列');

    }
    case 'connect-proto': state.connectProto = d.val; break;
    case 'connect-step': state.connectStep = Number(d.step); break;
    case 'connect-run-test': state.connectTested = true; toast('外部端点连通与边界回包验证通过'); break;
    case 'connect-finish': {
      const name = state.connectName || '外部自研 Agent';
      if (!state.agents.some(a => a.name === name)) {
        state.agents.push({ id: 'ext-' + Date.now(), name, kind: 'external-internal', scope: d.mode==='beta' ? '外部 · Beta' : '外部 · 认证中', desc: '通过多协议向导接入的外部 Agent，独立运行模型并接受平台边界观测。', owner: '林予接入', calls: 1, execRate: 100, effRate: 100, collabRate: null, p50: '1.9s', p95: '2.4s', tokens: '外部未披露', cost: '外部未披露', disclosed: false, health: 'ok' });
      }
      state.route = 'agents'; state.agentFilter = 'external'; state.connectStep = 1; state.connectTested = false;
      toast(d.mode === 'beta' ? `「${name}」已以 Beta 试用上线，可立即对话验证` : `「${name}」已提交全企业认证审核`);
      break;
    }
    case 'toggle-auto': {
      const au = state.automations.find(x => x.id === d.id);
      if (au) { au.enabled = !au.enabled; toast(au.enabled ? '已恢复定时运行' : '已暂停该定时任务'); }
      break;
    }
    case 'toggle-ev': {
      const ev = state.eventTriggers.find(x => x.id === d.id);
      if (ev) { ev.enabled = !ev.enabled; toast(ev.enabled ? `已启用「${ev.name}」实时事件唤醒` : `已暂停「${ev.name}」`); }

      break;
    }
    case 'kb-tab': state.kbTab = d.tab; break;
    case 'assign-gap': {
      const g = state.kbGaps.find(x => x.id === d.id);
      if (g) { g.status = 'assigned'; g.owner = '已指派 · 周宁'; toast('已生成知识补齐待办并推送飞书给责任人'); }
      break;
    }
    case 'resolve-conflict': {
      const c = state.kbConflicts.find(x => x.id === d.id);
      if (c) { c.resolved = true; toast('已锁定以《2026 全企差旅规范》为唯一优先权威口径'); }
      break;
    }
    case 'add-glossary': {
      const term = document.getElementById('glTermInput')?.value.trim();
      const formula = document.getElementById('glFormulaInput')?.value.trim();
      if (!term || !formula) { toast('请填写术语名称与统一计算口径定义'); return; }
      state.glossary.unshift({ id: 'gl-' + Date.now(), term, alias: '团队新增', formula, scope: currentSpace().name });
      toast(`已将「${term}」沉淀至口径词典，知识检索与业务查数立即同步生效`);
      break;
    }
    case 'set-default-tpl': {
      state.brandTemplates.forEach(t => { if (t.id === d.id) t.isDefault = true; });
      toast('已设为当前空间默认交付母版，沙箱生成文档将自动套版');
      break;
    }
    case 'open-ecom-demo': {
      state.activeSpace = 'sp-ecom';
      state.activeThreadId = 't-ecom';
      state.route = 'chat';
      state.canvasOpen = true;
      state.cmdOpen = false;
      state.popover = null;
      break;
    }
    case 'approve-l2-erp': {
      state.erpWritebackApproved = true;
      toast('已通过幂等键写入金蝶云星空 ERP，返回正式质检冻结单号 QC-20261125-089');
      break;
    }
    case 'promote-to-space': {
      state.activeSpace = 'sp-proc';
      toast('已将当前成果与上下文发布至「采购中心空间」（个人其余私聊保持私密）');
      break;
    }
    case 'run-handover': {
      state.handoverDone = true;
      toast('已完成公私分离交接：个人私聊已封存隔离，团队知识与触发器已平移给林予');
      break;
    }
    case 'run-eval-suite': {
      state.evalRunDone = true;
      toast('45 条企业黄金回归体检用例全部跑通，准确率 97.8%');
      break;
    }
    case 'mon-btab': state.monBottomTab = d.val; break;
    case 'open-trace': state.drawer = { type: 'trace', id: d.id }; break;
    case 'swap-tier': {
      const t = state.tiers.find(x => x.id === d.id);
      if (t) { const tmp = t.primary; t.primary = t.fallback; t.fallback = tmp; toast(`已将「${t.name}」主模型切换为 ${t.primary}（平台内全部 Agent 无感生效）`); }
      break;
    }
    case 'add-host': {
      const v = document.getElementById('newHostInput')?.value.trim();
      if (v) { state.allowlist.push(v); toast(`已将 ${v} 加入出站白名单（实时生效，无需重启）`); }
      break;
    }
    case 'rm-host': state.allowlist.splice(Number(d.idx), 1); toast('已从白名单移除'); break;
    case 'decide-rel': {
      const r = state.releases.find(x => x.id === d.id);
      if (r) {
        r.status = d.val;
        if (d.val === 'approved' && r.ecoId) {
          const eco = state.ecosystemItems.find(x => x.id === r.ecoId);
          if (eco) eco.status = 'approved';
          toast(`已批准「${r.name}」并固化缓存至企业库，员工现可一键加载`);
        } else {
          toast(d.val === 'approved' ? `已批准「${r.name}」全企业上架` : `已退回「${r.name}」`);
        }
      }
      break;
    }
    case 'open-cmd': state.cmdOpen = true; state.cmdQuery = ''; state.popover = null; break;
    case 'close-overlay': state.cmdOpen = false; state.modal = null; state.drawer = null; break;
    case 'toast': toast(d.msg); state.popover = null; break;
  }
  render();
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (btn) {
    if (btn.tagName === 'SELECT' || btn.tagName === 'INPUT') return;
    if (btn.dataset.act === 'close-overlay' && (btn.classList.contains('backdrop') || btn.classList.contains('drawer-wrap')) && e.target !== btn) return;
    handleAction(btn.dataset.act, btn);
    return;
  }
  if (state.popover && !e.target.closest('.popover')) {
    state.popover = null;
    render();
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'mon-filter') { state[el.dataset.key] = el.value; render(); }
  else if (act === 'canvas-ver') { state.canvasVersion = el.value; render(); }
  else if (act === 'studio-tier') { state.studioTier = el.value; toast('已切换逻辑能力档位：' + el.value); render(); }
  else if (act === 'connect-usage-toggle') { state.connectUsageOptIn = el.checked; }
});

document.addEventListener('input', e => {
  if (e.target.id === 'studioNameInput') state.studioName = e.target.value;
  if (e.target.id === 'connName') state.connectName = e.target.value;
  if (e.target.id === 'connUrl') state.connectUrl = e.target.value;
  if (e.target.id === 'collabCommentInput') state.commentDraft = e.target.value;
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.cmdOpen = !state.cmdOpen; state.cmdQuery = ''; render(); }
  else if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); state.collapsed = !state.collapsed; render(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); state.route = 'chat-new'; state.composerText = ''; render(); }
  else if (e.key === 'Escape') { state.cmdOpen = false; state.modal = null; state.drawer = null; state.popover = null; render(); }
