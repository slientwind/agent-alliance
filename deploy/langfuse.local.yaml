# Local integration-test installation only. Credentials below are public development fixtures.
# Production must use separate secrets, TLS and restricted outbound networking.
x-env: &env
  DATABASE_URL: postgresql://langfuse:local-langfuse-password@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:13100
  NEXTAUTH_SECRET: local-langfuse-session-secret-32-bytes
  SALT: local-langfuse-salt
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: local-clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_AUTH: local-redis-password
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: local-minio-password
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: local-minio-password
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
x-deps: &deps
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4
    ports: ['127.0.0.1:13100:3000']
    depends_on: *deps
    environment:
      <<: *env
      LANGFUSE_INIT_ORG_ID: alliance-local-org
      LANGFUSE_INIT_ORG_NAME: Agent Alliance Test
      LANGFUSE_INIT_PROJECT_ID: alliance-local-project
      LANGFUSE_INIT_PROJECT_NAME: Agent Alliance Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-alliance-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-alliance-local
      LANGFUSE_INIT_USER_EMAIL: alliance@example.test
      LANGFUSE_INIT_USER_NAME: Alliance Tester
      LANGFUSE_INIT_USER_PASSWORD: alliance-local-password
    mem_limit: 1500m
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    depends_on: *deps
    environment: *env
    mem_limit: 1500m
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: local-langfuse-password
      POSTGRES_DB: langfuse
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ['postgres:/var/lib/postgresql/data']
    mem_limit: 256m
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: local-clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ['clickhouse:/var/lib/clickhouse']
    mem_limit: 1500m
  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: local-minio-password
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 30
    volumes: ['minio:/data']
    mem_limit: 256m
  redis:
    image: redis:7.4-alpine
    command: --requirepass local-redis-password --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'local-redis-password', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ['redis:/data']
    mem_limit: 128m
volumes:
  postgres:
  clickhouse:
  minio:
  redis:
