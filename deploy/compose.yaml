services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: alliance
      POSTGRES_PASSWORD: ${ALLIANCE_DB_PASSWORD:-alliance-local-database}
      POSTGRES_DB: alliance
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - alliance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliance -d alliance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  alliance-postgres:
