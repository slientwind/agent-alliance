name: alliance-workspace
services:
  database:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: alliance
      POSTGRES_USER: alliance
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make configure}
    ports: ["127.0.0.1:15484:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U alliance -d alliance"]
      interval: 3s
      timeout: 2s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: database
      POSTGRES_USER: alliance
      POSTGRES_PWD: ${DB_PASSWORD}
    ports: ["127.0.0.1:17238:7233"]
volumes:
  postgres:
