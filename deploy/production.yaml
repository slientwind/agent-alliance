x-runtime: &runtime
  image: agent-alliance:local
  build:
    context: ..
  restart: unless-stopped
  environment: &env
    ALLIANCE_DATABASE_URL: postgres://alliance:${ALLIANCE_DB_PASSWORD:?required}@postgres:5432/alliance?sslmode=disable
    ALLIANCE_MASTER_KEY: ${ALLIANCE_MASTER_KEY:?required}
    ALLIANCE_ALLOW_PRIVATE: ${ALLIANCE_ALLOW_PRIVATE:-false}
    ALLIANCE_RUN_TIMEOUT_SECONDS: ${ALLIANCE_RUN_TIMEOUT_SECONDS:-300}
  depends_on:
    postgres: {condition: service_healthy}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  api:
    <<: *runtime
    environment:
      <<: *env
      ALLIANCE_MODE: api
      ALLIANCE_ADDR: 0.0.0.0:8080
      ALLIANCE_PUBLIC_URL: ${ALLIANCE_PUBLIC_URL:?required}
      ALLIANCE_ALLOW_REGISTRATION: ${ALLIANCE_ALLOW_REGISTRATION:-false}
      ALLIANCE_INSECURE_COOKIES: ${ALLIANCE_INSECURE_COOKIES:-false}
      ALLIANCE_GRPC_ADDR: 0.0.0.0:8081
      ALLIANCE_GRPC_PUBLIC_ADDR: ${ALLIANCE_GRPC_PUBLIC_ADDR:-}
      # h2c is isolated on the Compose network; terminate TLS at the ingress.
      ALLIANCE_INSECURE_GRPC: 'true'
    ports:
      - '127.0.0.1:${ALLIANCE_HTTP_PORT:-8180}:8080'
      - '127.0.0.1:${ALLIANCE_GRPC_PORT:-8181}:8081'
  worker:
    <<: *runtime
    environment:
      <<: *env
      ALLIANCE_MODE: worker
    deploy:
      replicas: 2
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alliance
      POSTGRES_USER: alliance
      POSTGRES_PASSWORD: ${ALLIANCE_DB_PASSWORD:?required}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alliance -d alliance']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  database:
