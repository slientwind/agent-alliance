services:
  api:
    networks: [default, preview-internal, business-browser-internal]
    build:
      context: ..
    image: alliance-workspace:local
    environment:
      DATABASE_URL: postgres://alliance:${DB_PASSWORD}@database:5432/alliance?sslmode=disable
      OBJECT_ROOT: /data/objects
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Run make configure}
      RESOURCE_KEY: ${RESOURCE_KEY:?Run make configure}
      RESOURCE_PREVIOUS_KEYS: ${RESOURCE_PREVIOUS_KEYS:-}
      HOT_STREAM_REDIS_URL: ${HOT_STREAM_REDIS_URL:-}
      PREVIEW_URL: http://preview:18727
      BUSINESS_BROWSER_URL: http://business-browser:18731
      AGENT_ALLOWED_HOSTS: ${AGENT_ALLOWED_HOSTS:-}
      CONNECTOR_URL: http://tools:18726
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?Generate a private connector token}
      TEMPORAL_ADDR: temporal:7233
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OIDC_CA_FILE: ${OIDC_CA_FILE:-}
      OIDC_MODE: ${OIDC_MODE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_EMERGENCY_MEMBER_ID: ${OIDC_EMERGENCY_MEMBER_ID:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      DINGTALK_MUTATION_TEMPLATE_ID: ${DINGTALK_MUTATION_TEMPLATE_ID:-}
    volumes: [objects:/data/objects]
    ports: ["127.0.0.1:18485:8080"]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    networks: [default, preview-internal, ecosystem-inspection, knowledge-parse-internal, business-browser-internal]
    image: alliance-workspace:local
    command: ["worker"]
    volumes: [objects:/data/objects, brand-templates:/data/templates, brand-socket:/run/alliance-brand:ro]
    environment:
      DATABASE_URL: postgres://alliance:${DB_PASSWORD}@database:5432/alliance?sslmode=disable
      RESOURCE_KEY: ${RESOURCE_KEY}
      RESOURCE_PREVIOUS_KEYS: ${RESOURCE_PREVIOUS_KEYS:-}
      HOT_STREAM_REDIS_URL: ${HOT_STREAM_REDIS_URL:-}
      HOT_STREAM_PUBLISH_URL: http://api:8080/internal/project-stream
      PREVIEW_URL: http://preview:18727
      AGENT_ALLOWED_HOSTS: ${AGENT_ALLOWED_HOSTS:-}
      CONNECTOR_URL: http://tools:18726
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?Generate a private connector token}
      ECOSYSTEM_INSPECTOR_URL: http://ecosystem-inspector:18828
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      TEMPORAL_ADDR: temporal:7233
      OBJECT_ROOT: /data/objects
      BRAND_TEMPLATE_ROOT: /data/templates
      BRAND_RENDERER_SOCKET: /run/alliance-brand/render.sock
      KB_PARSE_URL: http://knowledge-parser:18730
      BUSINESS_BROWSER_URL: http://business-browser:18731
    depends_on: [api, temporal, brand-renderer, knowledge-parser]
    restart: unless-stopped

  ecosystem-inspector:
    image: alliance-workspace:local
    command: ["ecosystem-inspector"]
    user: "10001:10001"
    init: true
    networks: [ecosystem-inspection]
    environment:
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?Generate a private connector token}
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    restart: unless-stopped

  tools:
    build: ../connectors
    environment:
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
  sandbox:
    profiles: [sandbox]
    build: ../sandbox
    image: alliance-sandbox:local
    networks: [sandbox-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=192m,mode=1777"]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 64
    init: true
  brand-renderer:
    build: ../sandbox
    image: alliance-sandbox:local
    user: "10001:10001"
    command: ["/opt/alliance/brand-renderer.py"]
    network_mode: none
    volumes: [brand-templates:/workspace/templates:ro, brand-socket:/run/alliance-brand]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 32
    init: true
    restart: unless-stopped
  preview:
    build: ../preview
    environment:
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN}
    networks: [preview-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=192m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 96
    restart: unless-stopped
  knowledge-parser:
    build:
      context: ../preview
      target: knowledge-parser
    environment:
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN}
    networks: [knowledge-parse-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 960m
    cpus: 2.0
    pids_limit: 40
    init: true
    restart: unless-stopped
  business-browser:
    build:
      context: ../connectors
      dockerfile: browser.Dockerfile
    environment:
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN}
    networks: [business-browser-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=192m,mode=1777"]
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 96
    init: true
    restart: unless-stopped
networks:
  preview-internal:
    internal: true
  sandbox-internal:
    internal: true
  ecosystem-inspection:
    internal: true
  knowledge-parse-internal:
    internal: true
  business-browser-internal:
    internal: true
volumes:
  objects:
  brand-templates:
  brand-socket:
