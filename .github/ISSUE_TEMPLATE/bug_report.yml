name: Bug Report
description: Report a bug or unexpected behavior in Agent Alliance
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened vs. what you expected to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version & Deployment Mode
      placeholder: "e.g., v0.2.1, Docker Compose on Ubuntu 24.04"
    validations:
      required: true
